<script>
  // Old game addresses (josephjackman.com/horserace/check.html and so on) moved under /games/.
  // Send any deep link there, keeping the rest of the path, the query and the hash.
  (function () {
    var moved = ['altwhiskerwars', 'infinitehive', 'horserace', 'thedeck', 'lieage', 'roleplay20', 'dungeonjoe'];
    var m = location.pathname.match(/^\/([^\/]+)(\/.*)?$/);
    var first = m ? m[1].toLowerCase() : '';
    if (first === 'whisker-wars') first = 'altwhiskerwars';
    if (moved.indexOf(first) >= 0) location.replace('/games/' + first + (m[2] || '/') + location.search + location.hash);
  })();
</script>
