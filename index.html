<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisker Wars | josephjackman.com</title>
<meta name="description" content="Home of Whisker Wars, a real-time cat-kingdom strategy game you can play with friends in the browser.">
<meta property="og:title" content="Whisker Wars">
<meta property="og:description" content="Real-time cat-kingdom strategy battles. Send a friend a room code and fight it out.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2b1d3a;
    --bg-2: #43295c;
    --card: #fff8ee;
    --ink: #3a2a48;
    --muted: #7a6a88;
    --accent: #ff6fa3;
    --accent-dark: #d94c82;
    --gold: #ffcf5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    font-family: 'Fredoka', system-ui, sans-serif;
    color: var(--card);
    background: radial-gradient(ellipse at top, var(--bg-2), var(--bg) 70%);
  }
  .site { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #cdb8e6; margin: 0 0 20px; }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    color: var(--ink);
    border-radius: 28px;
    padding: 32px 28px 28px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
  }
  .hero { font-size: 72px; line-height: 1; margin-bottom: 8px; }
  .hero span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .hero span:nth-child(2) { animation-delay: .3s; }
  .hero span:nth-child(3) { animation-delay: .6s; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  h1 { font-size: 40px; margin: 6px 0 4px; font-weight: 700; }
  .tag { color: var(--muted); font-size: 17px; margin: 0 0 24px; line-height: 1.4; }
  .play {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 22px;
    padding: 14px 40px;
    border-radius: 999px;
    box-shadow: 0 5px 0 var(--accent-dark);
    transition: transform .1s, box-shadow .1s;
  }
  .play:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--accent-dark); }
  .play:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
  ul { list-style: none; padding: 0; margin: 24px 0 0; text-align: left; font-size: 15px; color: var(--muted); }
  li { padding: 6px 0; border-top: 1px dashed #e6d9ca; }
  li b { color: var(--ink); font-weight: 600; }
  footer { margin-top: 20px; font-size: 13px; color: #a893c0; }
  @media (prefers-reduced-motion: reduce) { .hero span { animation: none; } }
</style>
</head>
<body>
  <p class="site">josephjackman.com</p>
  <main class="card">
    <div class="hero" aria-hidden="true"><span>😼</span><span>🏰</span><span>😾</span></div>
    <h1>Whisker Wars</h1>
    <p class="tag">Real-time cat kingdom battles. Send a friend a room code and fight it out.</p>
    <a class="play" href="whiskerwars/">Play now</a>
    <ul>
      <li><b>1v1 online</b>: share a 5-letter code, no sign-up</li>
      <li><b>12 cat heroes</b> with 36 silly spells</li>
      <li><b>Campaign and practice</b> against computer cats</li>
    </ul>
  </main>
  <footer>Works on desktop and phone browsers</footer>
</body>
</html>
