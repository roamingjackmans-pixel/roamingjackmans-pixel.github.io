.cbt-upg-name { font-family: var(--font-display); font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cbt-lv { font-size: 10px; font-family: var(--font-mono); padding: 1px 6px; border-radius: 99px; background: rgba(185, 161, 255, .16); color: var(--accent2); }
.cbt-upg-eff { font-size: 12px; color: var(--text); }
.cbt-upg-next { font-size: 11px; }
.cbt-upg-foot { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.cbt-pips { display: flex; gap: 3px; flex-wrap: wrap; }
.cbt-pips i { width: 9px; height: 10px; background: rgba(255, 255, 255, .08); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.cbt-pips i.on { background: var(--cbt-gold); box-shadow: 0 0 6px var(--cbt-gold); }
.cbt-bottom { margin-top: 14px; }
.cbt-bottom .card { margin-top: 0; }
@media (max-width: 760px) { .cbt-bottom { grid-template-columns: 1fr; } }
.cbt-rec { columns: 2; column-gap: 18px; }
.cbt-rec .kv { break-inside: avoid; }
@media (max-width: 560px) { .cbt-rec { columns: 1; } }
.cbt-sim select { min-width: 170px; }

/* ---------- briefing ---------- */
.cbt-brief { background: radial-gradient(700px 240px at 100% 0%, rgba(255, 77, 106, .12), transparent 70%), linear-gradient(180deg, var(--panel2), var(--panel)); }
.cbt-brief-head { margin-bottom: 14px; }
.cbt-brief-title { margin: 4px 0 4px; font-family: var(--font-display); font-size: 26px; font-weight: 700; }
.cbt-brief-grid { align-items: stretch; }
@media (max-width: 760px) { .cbt-brief-grid { grid-template-columns: 1fr; } }
.cbt-panel { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: rgba(0, 0, 0, .25); display: flex; flex-direction: column; gap: 8px; }
.cbt-panel.cbt-them { border-color: rgba(255, 77, 106, .35); }
.cbt-panel.cbt-us { border-color: rgba(255, 207, 77, .35); }
.cbt-panel-title { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .03em; }
.cbt-enemy-list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
.cbt-erow { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 8px 4px 4px; border-radius: 9px; background: rgba(255, 255, 255, .03); }
.cbt-erow.boss { background: linear-gradient(90deg, rgba(255, 61, 240, .18), rgba(255, 255, 255, .02)); border: 1px solid rgba(255, 61, 240, .4); }
.cbt-eico { width: 48px; height: 48px; border-radius: 8px; background: radial-gradient(circle, rgba(255, 77, 106, .18), rgba(0, 0, 0, .3)); }
.cbt-ecount { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: #ff9aa9; }
.cbt-vs { display: flex; flex-direction: column; gap: 6px; margin: 4px 0; }
.cbt-vs-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 12px; }
.cbt-vs-row b { text-align: right; }
.cbt-vs-bar { height: 10px; border-radius: 99px; background: rgba(0, 0, 0, .45); border: 1px solid var(--line); overflow: hidden; }
.cbt-vs-bar i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .3s; }
.cbt-vs-bar.me i { background: linear-gradient(90deg, #c98a00, var(--cbt-gold)); box-shadow: 0 0 10px rgba(255, 207, 77, .5); }
.cbt-vs-bar.them i { background: linear-gradient(90deg, #8a1030, var(--cbt-red)); box-shadow: 0 0 10px rgba(255, 77, 106, .5); }
.cbt-odds { font-size: 14px; }
.cbt-brief-build { margin-top: 12px; padding: 8px 10px; border-radius: 10px; background: rgba(0, 0, 0, .2); border: 1px solid var(--line); }
.cbt-brief-actions { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }

/* ---------- battle ---------- */
.cbt-hud { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px; align-items: end; margin-bottom: 8px; }
.cbt-side-name { font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: .2em; }

@keyframes cbtBanner { from { opacity: 0; transform: translateY(-50%) scale(1.6); filter: blur(6px); } }
.cbt-pause { position: absolute; inset: 0; z-index: 4; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; background: rgba(4, 3, 11, .72); backdrop-filter: blur(3px); }

<script>
/* ---- 00-util.js ---- */
/* ============================================================
   00-util.js — small helpers shared by every module
   ============================================================ */
(() => {
  'use strict';

  const SHORT = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'UDc', 'DDc', 'TDc',
    'QaDc', 'QiDc', 'SxDc', 'SpDc', 'OcDc', 'NoDc', 'Vg'];
  const LONG = ['', ' thousand', ' million', ' billion', ' trillion', ' quadrillion', ' quintillion',
    ' sextillion', ' septillion', ' octillion', ' nonillion', ' decillion', ' undecillion',
    ' duodecillion', ' tredecillion', ' quattuordecillion', ' quindecillion', ' sexdecillion',
    ' septendecillion', ' octodecillion', ' novemdecillion', ' vigintillion'];

  function notation() {
    try { return (window.Game && Game.settings && Game.settings.notation) || 'short'; } catch (e) { return 'short'; }
  }

  /** Format a number for display. dec = decimals for abbreviated numbers. */
  function fmt(n, dec = 2) {
    if (n === undefined || n === null || Number.isNaN(n)) return '0';
    if (!Number.isFinite(n)) return n > 0 ? '∞' : '-∞';
    const neg = n < 0; n = Math.abs(n);
    let out;
    if (n < 1000) {
      if (n === 0) out = '0';
      else if (n < 10 && n % 1 !== 0) out = (Math.floor(n * 100) / 100).toFixed(2).replace(/\.?0+$/, '');
      else if (n < 100 && n % 1 !== 0) out = (Math.floor(n * 10) / 10).toFixed(1).replace(/\.0$/, '');
      else out = String(Math.floor(n));
    } else {
      const mode = notation();
      const e = Math.floor(Math.log10(n));
      if (mode === 'sci' || e >= SHORT.length * 3) {
        const m = n / Math.pow(10, e);
        out = (Math.floor(m * 100) / 100).toFixed(2) + 'e' + e;
      } else {
        const tier = Math.floor(e / 3);
        const v = n / Math.pow(1000, tier);
        const d = v >= 100 ? Math.max(0, dec - 2) : v >= 10 ? Math.max(0, dec - 1) : dec;
        const p = Math.pow(10, d);
        out = (Math.floor(v * p) / p).toFixed(d) + (mode === 'long' ? LONG[tier] : SHORT[tier]);
      }
    }
    return (neg ? '-' : '') + out;
  }

  function fmtInt(n) {
    if (!Number.isFinite(n)) return fmt(n);
    if (Math.abs(n) < 1e6) return Math.floor(n).toLocaleString('en-US');
    return fmt(n);
  }

  function fmtPct(x, dec = 0) { return (x * 100).toFixed(dec) + '%'; }

  /** ms -> "1:02:03" or "2:03" */
  function fmtTime(ms) {
    ms = Math.max(0, ms || 0);

  }
  function seasonIdx() { return Math.floor(P().seasonT / SEASON_LEN) % 4; }
  function seasonProd(s) {
    if (s.id === 'winter') return Game.bought('greenhouse') ? 1 : Game.bought('cluster') ? 0.6 : 0.3;
    if ((s.id === 'spring' || s.id === 'summer') && Game.bought('almanac')) return s.prod + 0.1;
    return s.prod;
  }
  function priceMult() {
    let m = 1;
    if (Game.bought('labels')) m *= 1.25;
    if (Game.bought('brand')) m *= 1.5;
    if (Game.bought('organic')) m *= 1.4;
    return m * Game.mult('price');
  }
  function storageCap() {
    let s = 200 * Math.pow(1.7, P().frames);
    if (Game.bought('combArch')) s *= 3;
    return s * Game.mult('storage');
  }
  const frameCost = () => Math.ceil(8 * Math.pow(1.45, P().frames));
  const scoutCost = () => Math.ceil(30 * Math.pow(1.17, P().scouts));
  function waggleRate() {
    let m = 0.25 * PACE * P().scouts;
    if (Game.bought('academy')) m *= 2;
    if (Game.bought('swarmIQ')) m *= 2;
    if (Game.bought('dreaming')) m *= 1.5;
    return m * Game.mult('waggle');
  }
  function recalc() {
    const s = SEASONS[seasonIdx()];
    C.season = s;
    C.seasonProd = seasonProd(s);
    let base = 0;
    for (const b of BLD) base += owned(b.id) * b.rate * bldMult(b.id);
    C.honeyRate = base * PACE * globalMult() * C.seasonProd;
    let click = 1;
    if (Game.bought('gloves')) click *= 2;
    if (Game.bought('smoker')) click *= 2;
    if (Game.bought('swarmClick')) click *= 5;
    let pct = 0;
    if (Game.bought('telepathy')) pct += 0.03;
    if (Game.bought('swarmClick')) pct += 0.02;
    C.click = (click + C.honeyRate * pct) * Game.mult('click');
    C.fair = 1.0 * priceMult() * s.price;
    C.price = Math.max(0.01, C.fair * (1 + P().noise));
    C.waxRate = C.honeyRate * 0.05 * s.wax * Game.mult('wax');
    C.waggleRate = waggleRate();
    C.storage = storageCap();
    C.candleRate = Game.bought('candles') && P().candles ? C.waxRate * 0.9 * C.price * 3 : 0;
  }

  function sell(frac = 1, quiet) {
    const S = Game.S;

    const coins = amt * C.price;
    S.res.honey -= amt;
    Game.add('coins', coins);
    Game.stat('honeySold', amt);
    Game.stat('coinsFromHoney', coins);
    if (!quiet) Game.sfx('sell');
    if (C.price >= 3) Game.achieve('p1_sellhigh');
    return coins;
  }
  function buyCount(b) {
    const mode = P().buyMode;
    const k = owned(b.id);
    if (mode === 'max') return Math.max(1, U.maxAffordable(b.base, GROWTH, k, Game.S.res.coins));
    return mode;
  }
  function buyBld(b) {
    const n = buyCount(b);
    const cost = U.bulkCost(b.base, GROWTH, owned(b.id), n);
    if (!Game.spend({ coins: cost })) { Game.sfx('error'); return; }
    P().b[b.id] = owned(b.id) + n;

  function buyScout() {
    const n = P().buyMode === 'max' ? Math.max(1, U.maxAffordable(30, 1.17, P().scouts, Game.S.res.coins)) : P().buyMode;

    P().scouts += n;
    Game.sfx('buy');
  }
  function buyFrame() {

  function drawSpark() {
    const cv = mkt.spark, ctx = cv.getContext('2d');
    const w = cv.clientWidth || 300, h = 46, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.floor(w * dpr)) { cv.width = Math.floor(w * dpr); cv.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const H = P().hist;
    if (H.length < 2) return;
    let mn = Math.min(...H), mx = Math.max(...H);
    if (mx - mn < 1e-9) { mx += 0.5; mn -= 0.5; }
    const x = (i) => (i / (H.length - 1)) * w, y = (v) => h - 4 - ((v - mn) / (mx - mn)) * (h - 8);
    const grad = ctx.createLinearGradient(0, 0, 0, h);

    ctx.beginPath(); ctx.moveTo(0, h);
    H.forEach((v, i) => ctx.lineTo(x(i), y(v)));
    ctx.lineTo(w, h); ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath(); H.forEach((v, i) => (i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v))));

    const last = H[H.length - 1];
    ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(w - 2, y(last), 2.5, 0, Math.PI * 2); ctx.fill();
  }

    const cv = U.el('canvas');

    wrap.append(cv, label);
    const sc = { wrap, cv, ctx: cv.getContext('2d'), w: 600, h: 210, bees: [], flowers: [], parts: [], t: 0, label, seed: 7 };
    const ro = new ResizeObserver(() => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      sc.w = wrap.clientWidth || 600; sc.h = wrap.clientHeight || 210;
      cv.width = sc.w * dpr; cv.height = sc.h * dpr;

  }
  function seedFlowers(sc) {
    const rnd = U.seeded(sc.seed);
    sc.flowers = [];
    for (let i = 0; i < 60; i++) {
      sc.flowers.push({
        x: 0.28 * sc.w + rnd() * 0.7 * sc.w, y: sc.h * 0.72 + rnd() * sc.h * 0.24, c: ['#ff7eb6', '#ffd23f', '#fff', '#b28dff', '#ff9f43', '#6be0ff'][Math.floor(rnd() * 6)],
        s: 3 + rnd() * 3.5, ph: rnd() * 6,
      });
    }
    sc.flowers.sort((a, b) => a.y - b.y);
  }
  function hivePos(sc) { return { x: sc.w * 0.13, y: sc.h * 0.62 }; }
  function spawnBee(sc, x, y) {
    if (sc.bees.length > 90) return;
    const h = hivePos(sc);
    sc.bees.push({ x: x ?? h.x, y: y ?? h.y, tx: 0, ty: 0, target: null, home: false, sp: 40 + Math.random() * 50, ph: Math.random() * 6, carry: 0, wait: 0 });
  }
  function drawScene(dt) {
    const sc = scene; if (!sc) return;
    const ctx = sc.ctx, w = sc.w, h = sc.h;
    sc.t += dt;
    const sIdx = seasonIdx();
    const skies = [['#7ec8ff', '#e6f6ff'], ['#4fb3ff', '#cdefff'], ['#f5a25d', '#ffe2b8'], ['#8aa1c1', '#dfe8f2']];
    const grounds = [['#62c462', '#3f9a44'], ['#4cbb4c', '#2f8a37'], ['#b8a04a', '#7f6a2b'], ['#e9f1f7', '#bccad6']];
    const sk = ctx.createLinearGradient(0, 0, 0, h);
    sk.addColorStop(0, skies[sIdx][0]); sk.addColorStop(1, skies[sIdx][1]);
    ctx.fillStyle = sk; ctx.fillRect(0, 0, w, h);
    // sun
    const sunX = w * 0.84, sunY = h * 0.2;
    const sg = ctx.createRadialGradient(sunX, sunY, 2, sunX, sunY, 46);
    sg.addColorStop(0, sIdx === 3 ? 'rgba(255,255,255,.9)' : 'rgba(255,248,200,1)'); sg.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sunX, sunY, 46, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = sIdx === 3 ? '#fdfdfd' : '#fff6c7'; ctx.beginPath(); ctx.arc(sunX, sunY, 15, 0, Math.PI * 2); ctx.fill();
    // clouds
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (let i = 0; i < 3; i++) {
      const cx = ((sc.t * (6 + i * 3) + i * 260) % (w + 200)) - 100, cy = 26 + i * 18;
      ctx.beginPath(); ctx.ellipse(cx, cy, 34, 10, 0, 0, Math.PI * 2); ctx.ellipse(cx + 22, cy - 6, 22, 10, 0, 0, Math.PI * 2); ctx.fill();
    }
    // distant hills + skyline buildings by ownership
    ctx.fillStyle = sIdx === 3 ? '#cfdbe6' : sIdx === 2 ? '#c99a52' : '#8fd18a';
    ctx.beginPath(); ctx.moveTo(0, h * 0.62);
    for (let x = 0; x <= w; x += 20) ctx.lineTo(x, h * 0.6 - Math.sin(x * 0.012 + 1) * 14 - Math.sin(x * 0.03) * 5);
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();
    drawSkyline(ctx, w, h);
    // ground
    const gg = ctx.createLinearGradient(0, h * 0.66, 0, h);
    gg.addColorStop(0, grounds[sIdx][0]); gg.addColorStop(1, grounds[sIdx][1]);
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.moveTo(0, h * 0.7);
    for (let x = 0; x <= w; x += 16) ctx.lineTo(x, h * 0.68 + Math.sin(x * 0.02) * 4);
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();
    // fence
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let x = w * 0.25; x < w; x += 22) ctx.fillRect(x, h * 0.6, 4, h * 0.1);
    ctx.fillRect(w * 0.25, h * 0.625, w * 0.75, 3);
    // flowers (count grows)
    const nFlowers = Math.min(sc.flowers.length, 6 + owned('forager') * 2 + owned('clover') * 4 + Math.floor(owned('worker') / 3));
    const bloom = sIdx === 3 ? 0.3 : sIdx === 2 ? 0.7 : 1;
    for (let i = 0; i < nFlowers; i++) {
      const f = sc.flowers[i];
      const sway = Math.sin(sc.t * 1.6 + f.ph) * 1.5;
      ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(f.x, f.y + 8); ctx.lineTo(f.x + sway, f.y); ctx.stroke();
      if (bloom > 0.35) {
        ctx.fillStyle = f.c; ctx.globalAlpha = bloom;
        for (let p = 0; p < 5; p++) { const a = p * 1.2566 + f.ph; ctx.beginPath(); ctx.arc(f.x + sway + Math.cos(a) * f.s * 0.8, f.y + Math.sin(a) * f.s * 0.8, f.s * 0.6, 0, Math.PI * 2); ctx.fill(); }
        ctx.globalAlpha = 1; ctx.fillStyle = '#ffcf33'; ctx.beginPath(); ctx.arc(f.x + sway, f.y, f.s * 0.45, 0, Math.PI * 2); ctx.fill();
      }
    }
    // hive (stacked boxes)
    const hp = hivePos(sc);
    const boxes = 1 + Math.min(5, owned('hivebox'));
    for (let i = 0; i < boxes; i++) {
      const bw = 54, bh = 20, bx = hp.x - bw / 2, by = hp.y + 18 - (i + 1) * bh;
      ctx.fillStyle = i % 2 ? '#e2a64b' : '#d6953a'; ctx.fillRect(bx, by, bw, bh - 2);
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(bx, by + bh - 4, bw, 2);
    }
    const topY = hp.y + 18 - boxes * 20;
    ctx.fillStyle = '#8d5a2b'; ctx.fillRect(hp.x - 32, topY - 6, 64, 7);
    ctx.fillStyle = '#3a2410'; ctx.fillRect(hp.x - 8, hp.y + 8, 16, 5);
    // bees
    const target = Math.min(Game.gfx() === 'high' ? 80 : Game.gfx() === 'low' ? 15 : 40, 3 + Math.floor(Math.sqrt(totalBld()) * 4));
    while (sc.bees.length < target) spawnBee(sc);
    for (let i = sc.bees.length - 1; i >= 0; i--) {
      const be = sc.bees[i];

    const exp = Game.bought('p2_diplomacy') || true ? p.exportPct / 100 : 0;
    C.honeyRate = grossHoney * (1 - exp);
    C.coinRate = grossHoney * exp * K.exportPrice * Game.mult('price') * Game.mult('coins');
    C.waxRate = sw * (a.build / 100) * K.waxPerBee * K.pace * C.jobMult * Game.mult('build') * Game.mult('wax');
    let em = 1;
    if (Game.bought('p2_pheromap')) em *= 2;
    if (Game.bought('p2_hivemind')) em *= 1.5;
    C.expRate = sw * (a.expand / 100) * K.expandPerBee * K.pace * C.jobMult * em * Game.mult('expand');
    let wm = 1;
    if (Game.bought('p2_hivemind')) wm *= 3;
    C.waggleRate = Math.sqrt(sw) * 0.002 * K.pace * wm * Game.mult('waggle');
    let inf = Game.bought('p2_urban') ? p.cities * 0.05 : 0;
    inf += cityMults()._inf;
    if (Game.bought('p2_embassy')) inf += p.hives * 0.03;
    if (Game.bought('p2_unity')) inf *= 2;
    C.influenceRate = inf;
  }
  Game.p2 = {
    calc: C,
    K,
    progress: () => {
      const p = Game.S.phase2;
      if (!p || !p.map) return 0;
      const ark = arkProgress();
      return Math.min(1, (p.converted / p.map.conv.length) * 0.85 + ark * 0.15);
    },
  };
  function arkProgress() { const a = P().ark; return ARK.reduce((s, m) => s + (a[m.id] || 0), 0) / (ARK.length * ARK_LEVELS); }
  const arkCost = (m) => { const lv = P().ark[m.id] || 0; const o = {}; for (const k in m.cost) o[k] = m.cost[k] * Math.pow(ARK_GROWTH, lv); return o; };
  const hiveCost = () => ({ honey: K.hiveHoney * Math.pow(K.hiveGrowth, P().hives), wax: K.hiveWax * Math.pow(K.hiveGrowth, P().hives) });
  const lobbyCost = () => K.lobbyCoins * Math.pow(K.lobbyGrowth, P().lobbies);

  /* ---------------- conversion ---------------- */
  const flashes = [];
  function convert(i, manual) {
    const p = P();
    const t = HT[typeAt(i)];
    if (t.city) {   // only reached from winCity(): the talks already paid the influence
      p.cities++;
      if (p.cities === 1) Game.log('🏙️ The first city has agreed to become a garden. The mayor now wears a flower crown to work.', 'story');
    }
    p.map.conv[i] = 1;
    p.converted++;
    C.conv = p.converted;
    if (typeAt(i) === 'o' && !p.ms.ocean) { p.ms.ocean = 1; Game.log('🌊 Lily rafts drift out across the sea, each carrying a tiny colony.', 'story'); }
    frontierDirty = true;
    if (!Game.offline) {
      flashes.push({ i, t: 0 });
      if (manual || Math.random() < 0.15) Game.sfx('coin');
    }
    if (p.target === i) p.target = -1;
    Game.stat('hexes');
    return true;
  }

  /* ---------------- cities & City Talks ----------------
     Cities never join by expansion. Reach one with your meadows, pay influence to open talks,
     then solve the mayor's riddle or pick the right approach in their story.
     Each city grants a permanent Phase II bonus (its specialty); a Grand Welcome doubles it. */
  const DIP = () => Game.DIPLO;
  const SPEC = (id) => DIP().SPECIALTIES.find((s) => s.id === id);
  const chAll = () => DIP().RIDDLES.concat(DIP().STORIES);
  const chById = (id) => chAll().find((c) => c.id === id);
  const fillText = (s, c) => String(s).replace(/\{city\}/g, c.name).replace(/\{mayor\}/g, c.mayor);
  let cityBonus = null;      // cached city multipliers (cleared when a city joins or research changes)
  let talkModal = null;

  function cityIdx() {
    const p = P(), out = [];
    if (!p || !p.map) return out;
    for (let i = 0; i < p.map.types.length; i++) if (p.map.types[i] === 'c') out.push(i);
    return out;
  }
  const cityTotal = () => cityIdx().length;
  function ensureCities() {
    const p = P();
    if (!p || !p.map) return;
    if (!p.cityInfo || typeof p.cityInfo !== 'object') p.cityInfo = {};
    const idx = cityIdx();
    if (idx.every((i) => p.cityInfo[i])) return;
    const rnd = U.seeded((p.seed || 1) + 7919);
    const sh = (arr) => { const a = arr.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
    const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
    const names = sh(DIP().CITY_NAMES), specs = sh(DIP().SPECIALTIES.map((s) => s.id));
    idx.forEach((i, k) => {
      if (p.cityInfo[i]) return;
      p.cityInfo[i] = {
        name: names[k % names.length] + (k >= names.length ? ' II' : ''),
        mayor: `${pick(DIP().MAYOR_FIRST)} ${pick(DIP().MAYOR_LAST)}`,
        sp: specs[k % specs.length], ch: null, cool: 0, fails: 0,
        won: p.map.conv[i] === 1, grand: false,   // cities converted in an older save count as joined
      };
    });
    cityBonus = null;
  }
  /** won · talk · ready · cool · far · locked */
  function cityState(i) {
    const p = P(), c = p.cityInfo && p.cityInfo[i];
    if (!c) return 'far';
    if (c.won || isConv(i)) return 'won';
    if (!Game.bought('p2_diplomacy')) return 'locked';
    if (p.talk && p.talk.i === i) return 'talk';
    if (frontierDirty) rebuildFrontier();
    if (!frontier.includes(i)) return 'far';
    if ((c.cool || 0) > Game.S.time) return 'cool';
    return 'ready';
  }
  function cityMults() {
    if (cityBonus) return cityBonus;
    const p = P(), out = { _inf: 0 };
    if (!p || !p.cityInfo) return out;
    const sis = Game.bought('p2_sister') ? 1.5 : 1;
    for (const k in p.cityInfo) {
      const c = p.cityInfo[k];
      if (!c.won) continue;
      const sp = SPEC(c.sp);
      if (!sp) continue;
      const amt = sp.base * (c.grand ? 2 : 1) * sis;
      if (sp.flat) out._inf += amt;
      else out[sp.key] = (out[sp.key] || 1) * (1 + amt);
    }
    cityBonus = out;
    return out;
  }
  function specText(sp, grand) {
    const amt = sp.base * (grand ? 2 : 1) * (Game.bought('p2_sister') ? 1.5 : 1);
    return sp.flat ? `+${+amt.toFixed(2)} 🤝/s` : `${sp.label} +${Math.round(amt * 100)}%`;
  }
  function pickChallenge() {
    const p = P();
    if (!Array.isArray(p.chUsed)) p.chUsed = [];
    let pool = chAll().filter((c) => !p.chUsed.includes(c.id));
    if (!pool.length) { p.chUsed = []; pool = chAll(); }
    const ch = U.pick(pool);
    p.chUsed.push(ch.id);
    return ch.id;
  }

  function openTalks(i, quiet) {
    const p = P(), c = p.cityInfo[i];
    if (!c) return false;
    const st = cityState(i);
    if (st === 'talk') { if (!quiet) showTalk(); return true; }
    const say = (msg) => { if (!quiet) { Game.sfx('error'); Game.toast(msg, 'bad', '🏙️'); } return false; };
    if (p.talk) { if (!quiet) showTalk(); return say(`Finish your talks with ${p.cityInfo[p.talk.i].name} first.`); }
    if (st === 'won') return false;
    if (st === 'locked') return say('Research 🤝 Bee Diplomacy to open City Talks.');
    if (st === 'far') return say(`Bloom a meadow next to ${c.name} before opening talks.`);
    if (st === 'cool') return say(`${c.name} needs time. Talks reopen in ${Math.ceil(c.cool - Game.S.time)}s.`);
    const cost = cityCost();
    if (!Game.spend({ influence: cost })) return say(`Opening talks with ${c.name} costs 🤝 ${cost} influence.`);
    if (!c.ch || !chById(c.ch)) c.ch = pickChallenge();
    const ch = chById(c.ch);
    const n = ch.kind === 'riddle' ? 4 : ch.choices.length;
    const order = U.shuffle(Array.from({ length: n }, (_, k) => k));
    const struck = ch.kind === 'riddle' && Game.bought('p2_oracle') ? [U.pick([1, 2, 3])] : [];
    p.talk = { i, ch: ch.id, paid: cost, order, struck, intro: Math.floor(Math.random() * DIP().RIDDLE_INTROS.length) };
    Game.stat('talks');
    if (!quiet) { Game.sfx('click'); showTalk(); }
    return true;
  }

  function showTalk() {
    const p = P(), t = p.talk;
    if (!t) return;
    const c = p.cityInfo[t.i], ch = chById(t.ch), sp = SPEC(c.sp);
    if (!c || !ch || !sp) { p.talk = null; return; }
    if (talkModal) talkModal.close();
    const grandOk = !c.fails;
    const body = U.el('div', { class: 'talk' },
      U.el('div', { class: 'talk-head' }, U.el('span', { class: 'talk-ico', text: sp.icon }),
        U.el('div', {}, U.el('div', { class: 'talk-city', text: c.name }), U.el('div', { class: 'hint', text: `${sp.name} · Mayor ${c.mayor}` }))),
      U.el('div', { class: 'talk-prize', html: `If ${c.name} joins: <b class="good">${specText(sp, false)}</b> for the rest of Phase II` +
        (grandOk ? ` · <span class="royal">Grand Welcome (best answer): <b>${specText(sp, true)}</b></span>` : ' · <span class="dim">no Grand Welcome after failed talks</span>') }),
      U.el('p', { class: 'talk-text', html: ch.kind === 'riddle'
        ? `${U.escapeHTML(fillText(DIP().RIDDLE_INTROS[t.intro || 0], c))}<br><b class="talk-q">“${U.escapeHTML(ch.q)}”</b>`
        : U.escapeHTML(fillText(ch.text, c)) }));
    const opts = U.el('div', { class: 'talk-opts' + (ch.kind === 'story' ? ' story' : '') });
    for (const oi of t.order) {
      const label = ch.kind === 'riddle' ? (oi === 0 ? ch.a : ch.w[oi - 1]) : ch.choices[oi].label;
      const struck = t.struck.includes(oi);
      opts.appendChild(U.el('button', { class: 'btn talk-opt' + (struck ? ' struck' : ''), type: 'button', disabled: struck, title: struck ? 'The Riddle Oracle ruled this one out' : '', on: { click: () => answerTalk(oi) } }, label));
    }
    body.append(opts, U.el('div', { class: 'hint', text: ch.kind === 'riddle'
      ? `A wrong answer ends the talks: the influence is ${Game.bought('p2_oracle') ? 'half refunded' : 'lost'} and ${c.name} needs ${K.talkCooldown}s before trying again (with a new question).`
      : `Read the mayor carefully. One approach wins them over, one works for a price, and one ends the talks.` }));
    talkModal = Game.modal({ title: '🏙️ City Talks', body, wide: true, buttons: [{ label: 'Think it over (talks stay open)' }], onClose: () => { talkModal = null; } });
  }

  function answerTalk(oi, quiet) {
    const p = P(), t = p.talk;
    if (!t) return null;
    const c = p.cityInfo[t.i], ch = chById(t.ch);
    if (talkModal) { const m = talkModal; talkModal = null; m.close(); }
    p.talk = null;
    let outcome, reply;
    if (ch.kind === 'riddle') {
      outcome = oi === 0 ? 'best' : 'bad';
      reply = oi === 0 ? `“${ch.a}” — correct!` : `Not quite. The answer was “${ch.a}”.`;
      Game.stat(oi === 0 ? 'riddlesSolved' : 'riddlesMissed');
    } else {
      const choice = ch.choices[oi] || ch.choices[0];
      outcome = choice.r;
      reply = fillText(choice.reply, c);
      if (outcome === 'ok' && choice.cost) {
        const S = Game.S, r = choice.cost.res;
        S.res[r] = (S.res[r] || 0) * (1 - choice.cost.pct);
      }
    }
    if (outcome === 'bad') {
      c.fails = (c.fails || 0) + 1;
      c.cool = Game.S.time + K.talkCooldown;
      c.ch = null;   // a new challenge next time
      if (Game.bought('p2_oracle')) Game.add('influence', t.paid * 0.5);
      Game.log(`🏙️ Talks with <b>${c.name}</b> failed. ${U.escapeHTML(reply)} The city will listen again in ${K.talkCooldown}s.`, 'warn');
      if (!quiet) { Game.sfx('error'); Game.toast(`Talks with ${c.name} failed`, 'bad', '🏙️'); }
      return { won: false };
    }
    return winCity(t.i, outcome === 'best' && !c.fails, reply, t.paid, quiet);
  }

  function winCity(i, grand, reply, paid, quiet) {
    const p = P(), c = p.cityInfo[i], sp = SPEC(c.sp);
    c.won = true; c.grand = !!grand;
    convert(i, !quiet);
    cityBonus = null;
    recalc();
    // tribute: a lump of coins and Royal Jelly (more for a Grand Welcome)
    const coins = Math.max(5e8, C.coinRate * 180) * (grand ? 2 : 1);
    const jelly = grand ? 3 : 1;
    Game.add('coins', coins);
    Game.add('jelly', jelly);
    let inf = 0;
    if (grand) { inf = Math.round(paid * 0.5); Game.add('influence', inf); }
    Game.stat('citiesWon');
    if (grand) Game.stat('grandWelcomes');
    Game.achieve('p2_city1');
    if ((Game.S.stats.grandWelcomes || 0) >= 5) Game.achieve('p2_grand5');
    if (cityIdx().every((k) => p.cityInfo[k] && p.cityInfo[k].won)) Game.achieve('p2_allcities');
    const reward = `${sp.icon} <b>${sp.name}:</b> ${specText(sp, grand)} for the rest of Phase II · tribute 🪙 ${U.fmt(coins)} + 👑 ${jelly}${inf ? ` + 🤝 ${inf} back` : ''}`;
    Game.log(`🏙️ <b>${c.name}</b> joins the Hive${grand ? ' with a <b>Grand Welcome</b>' : ''}! ${reward}`, grand ? 'royal' : 'good');
    if (!quiet) {
      Game.sfx(grand ? 'levelup' : 'upgrade');
      if (grand) Game.flash('#f5d0ff');
      Game.modal({
        title: grand ? `👑 Grand Welcome in ${c.name}!` : `🏙️ ${c.name} joins the Hive!`,
        body: `<p>${U.escapeHTML(reply)}</p><p>${reward}</p>` +
          (grand ? '<p class="hint">A Grand Welcome doubles the city’s bonus and returns half the influence you spent.</p>' : ''),
        buttons: [{ label: 'Wonderful', kind: 'primary' }],
      });
    }
    return { won: true, grand: !!grand };
  }

  /* ---------------- World Council policies (spend influence for short boosts) ---------------- */
  // influence costs are 5× the original 12 / 10 / 10 / 14 / 12
  const POLICIES = [
    { id: 'bloom', icon: '🌻', name: 'Pollinator Protection Act', cost: 60, cd: 300, secs: 30, mult: { expand: 2 }, desc: 'Expansion ×2' },
    { id: 'subsidy', icon: '🍯', name: 'Honey Export Subsidies', cost: 50, cd: 240, secs: 45, mult: { coins: 3 }, desc: 'Coin income ×3' },
    { id: 'works', icon: '🏗️', name: 'Public Works Program', cost: 50, cd: 240, secs: 45, mult: { wax: 1.5 }, desc: 'Wax ×1.5' },   // wax drives the Ark: keep modest
    { id: 'week', icon: '📣', name: 'Bee Awareness Week', cost: 70, cd: 300, secs: 30, mult: { swarm: 2 }, desc: 'Swarm growth ×2' },
    { id: 'grants', icon: '🎓', name: 'Science Grants', cost: 60, cd: 300, secs: 45, mult: { waggle: 3 }, desc: 'Waggle ×3' },
  ];
  const polCost = (pl) => Math.ceil(pl.cost * (Game.bought('p2_press') ? 0.75 : 1));
  const polCd = (pl) => pl.cd * (Game.bought('p2_press') ? 0.75 : 1);
  const polSecs = (pl) => pl.secs * (Game.bought('p2_unity') ? 2 : 1);
  const polLeft = (pl) => Math.max(0, ((P().pol || {})[pl.id] || 0) - Game.S.time);
  function enact(id, quiet) {
    const pl = POLICIES.find((x) => x.id === id);
    if (!pl || !Game.bought('p2_council')) return false;
    if (polLeft(pl) > 0) { if (!quiet) Game.sfx('error'); return false; }
    if (!Game.spend({ influence: polCost(pl) })) { if (!quiet) { Game.sfx('error'); Game.toast(`${pl.name} needs 🤝 ${polCost(pl)} influence`, 'bad', pl.icon); } return false; }
    if (!P().pol || typeof P().pol !== 'object') P().pol = {};
    P().pol[pl.id] = Game.S.time + polCd(pl);
    Game.buff({ id: 'pol_' + pl.id, label: pl.name, icon: pl.icon, secs: polSecs(pl), mult: pl.mult });
    Game.stat('policies');
    if (!quiet) { Game.sfx('upgrade'); Game.log(`🏛️ The World Council passes the <b>${pl.name}</b>: ${pl.desc} for ${polSecs(pl)}s.`, 'info'); }
    return true;
  }

  /* ---------------- research ---------------- */
  const pct = () => (P() && P().map ? P().converted / P().map.conv.length : 0);
  Game.defineProjects([
    { id: 'p2_robo1', phase: 2, icon: '🤖', name: 'Robo-Bee Prototypes', desc: 'Every swarm job is <b>×2</b> as effective.', cost: { honey: 2e9, waggle: 300 } },
    { id: 'p2_brood', phase: 2, icon: '🥚', name: 'Brood Chambers', desc: 'Swarm growth rate <b>×2</b>.', cost: { honey: 1e9, waggle: 250 } },
    { id: 'p2_court', phase: 2, icon: '👸', name: 'Queen’s Court', desc: 'Royal Jelly production <b>×1.5</b> (in every phase). Each Mega-Hive already brews a little.', cost: { honey: 2e12, waggle: 6000 }, req: () => P().hives >= 6 },
    { id: 'p2_diplomacy', phase: 2, icon: '🤝', name: 'Bee Diplomacy', desc: 'Unlocks <b>Influence</b> and <b>City Talks</b>: lobby world leaders with coins, then win over 🏙️ cities with riddles and stories. Every city grants a permanent bonus.', cost: { coins: 2e9, waggle: 400 }, req: () => P().converted >= 4 },
    { id: 'p2_envoys', phase: 2, icon: '🕊️', name: 'Envoy Corps', desc: 'Lobbying world leaders gives <b>×2</b> influence.', cost: { coins: 2e10, waggle: 800 }, req: () => Game.bought('p2_diplomacy') && P().lobbies >= 2 },
    { id: 'p2_council', phase: 2, icon: '🏛️', name: 'World Council', desc: 'Unlocks <b>Policies</b>: spend influence on short, powerful boosts (expansion, coins, wax, swarm, waggle).', cost: { honey: 4e10, waggle: 1500 }, req: () => Game.bought('p2_diplomacy') && P().cities >= 1 },
    { id: 'p2_oracle', phase: 2, icon: '🔮', name: 'Riddle Oracle', desc: 'In City Talks, one wrong riddle answer is crossed out, and failed talks refund <b>half</b> the influence.', cost: { honey: 8e10, waggle: 1800 }, req: () => Game.bought('p2_diplomacy') && (Game.S.stats.talks || 0) >= 1 },
    { id: 'p2_embassy', phase: 2, icon: '🏯', name: 'Embassy Hives', desc: 'Every Mega-Hive hosts an embassy: <b>+0.03 🤝/s</b> each.', cost: { honey: 3e11, wax: 1e8, waggle: 3000 }, req: () => Game.bought('p2_diplomacy') && P().hives >= 5 },
    { id: 'p2_press', phase: 2, icon: '📰', name: 'Bee Press Office', desc: 'Policies cost <b>25%</b> less influence and recharge <b>25%</b> faster.', cost: { coins: 6e11, waggle: 4000 }, req: () => Game.bought('p2_council') && (Game.S.stats.policies || 0) >= 2 },
    { id: 'p2_sister', phase: 2, icon: '💞', name: 'Sister Cities', desc: 'Every city bonus is <b>×1.5</b> stronger.', cost: { coins: 1e12, waggle: 4500 }, req: () => P().cities >= Math.min(4, cityTotal()) && P().cities >= 2 },
    { id: 'p2_unity', phase: 2, icon: '🌐', name: 'United Nectar Nations', kind: 'story', desc: 'The cities of Earth unite under the Hive. All influence income <b>×2</b>, and policies last <b>twice</b> as long.', flavor: '“One flag. It has a bee on it.”', cost: { honey: 3e12, waggle: 1.2e4 }, req: () => P().cities >= Math.max(3, Math.ceil(cityTotal() * 0.6)), done: 'Every flag on Earth is lowered and raised again, now with a small bee in the corner.' },
    { id: 'p2_cactus', phase: 2, icon: '🌵', name: 'Cactus Bloom', desc: 'Your bees can pollinate 🏜️ deserts.', cost: { honey: 6e8, waggle: 500 }, req: () => P().converted >= 6 || stuckOn('d') },
    { id: 'p2_lily', phase: 2, icon: '🪷', name: 'Lily Rafts', desc: 'Floating gardens let you claim 🌊 oceans — slowly. Coastal water costs <b>4×</b> as much as plains; deep ocean <b>7×</b>.', cost: { honey: 6e9, waggle: 1200 }, req: () => P().converted >= 20 || stuckOn('o') },
    { id: 'p2_alpine', phase: 2, icon: '🏔️', name: 'Alpine Wings', desc: 'Your bees can pollinate ⛰️ mountains.', cost: { honey: 2.5e9, waggle: 900 }, req: () => P().converted >= 15 || stuckOn('m') },
    { id: 'p2_pheromap', phase: 2, icon: '🧭', name: 'Pheromone Mapping', desc: 'Expansion <b>×2</b>.', cost: { honey: 3e10, waggle: 1800 }, req: () => P().converted >= 25 },
    { id: 'p2_thermal', phase: 2, icon: '🧣', name: 'Thermal Fuzz', desc: 'Your bees can pollinate 🧊 ice caps — very slowly. Ice costs <b>14×</b> as much as plains: twice as much as deep ocean.', cost: { honey: 2e11, waggle: 2500 }, req: () => P().converted >= 50 || stuckOn('i') },
    { id: 'p2_skycomb', phase: 2, icon: '☁️', name: 'Sky Combs', desc: 'Floating hives: swarm capacity <b>×3</b>.', cost: { honey: 3e11, wax: 3e8, waggle: 3500 }, req: () => P().hives >= 3 },
    { id: 'p2_robo2', phase: 2, icon: '🦾', name: 'Robo-Bees Mk II', desc: 'Every swarm job is <b>×2</b> as effective.', cost: { honey: 6e11, waggle: 5000 }, req: () => Game.bought('p2_robo1') && P().converted >= 40 },
    { id: 'p2_weather', phase: 2, icon: '🌦️', name: 'Weather Shaping', desc: 'Storms no longer slow you down, and honey <b>×1.5</b>.', cost: { honey: 1e12, waggle: 6500 }, req: () => (Game.S.stats.storms || 0) >= 1 || P().converted >= 80 },
    { id: 'p2_urban', phase: 2, icon: '🏡', name: 'Urban Gardens', desc: 'City Talks cost <b>50%</b> less influence, and every city that has joined produces <b>+0.05 🤝/s</b>.', cost: { coins: 5e11, waggle: 700 }, req: () => P().cities >= Math.min(3, cityTotal()) && P().cities >= 1 },
    { id: 'p2_grid', phase: 2, icon: '🕸️', name: 'Global Pollination Grid', desc: 'Honey <b>×3</b>.', cost: { honey: 3e12, waggle: 1e4 }, req: () => pct() >= 0.3 },

  function revertHexes(n) {
    const p = P();

    // prefer edge hexes
    const edge = owned.filter((i) => neighbors(i).some((j) => conv[j] !== 1));
    const pool = U.shuffle(edge.length >= n ? edge : owned).slice(0, n);
    for (const i of pool) { conv[i] = 0; p.converted--; }

    return pool.length;
  }

      if (S.phase !== 3 || S.ended) return;

      Game.add('stardust', C.stardustRate * dt);
      Game.add('ships', C.shipRate * dt);
      Game.add('waggle', C.waggleRate * dt);
      Game.add('coins', C.coinRate * dt);

        const nx = pickNext();
        if (nx < 0) { p.pool = Math.min(p.pool, 3); break; }
        const c = starCost(nx);
        if (p.pool < c) break;
        G().c[nx] = 1; p.pool -= c; C.claimed++;

        if (!Game.offline && Math.random() < 0.3) Game.sfx('coin');

      Game.setIncome('waggle', C.waggleRate);
      Game.setIncome('coins', C.coinRate);
      Game.setIncome('ships', C.shipRate);

    if (pay > 0) Game.add('coins', pay);
    const net = pay - bet;
    Game.stat('casinoNet', net);
    session += net;
    if (net > 0) Game.statMax('casinoBiggestWin', net);
    if (allIn) {
      if (pay > bet) call('achieve', 'cas_allin_win');
      else if (pay <= 0) call('achieve', 'cas_allin_lose');
    }
    if ((Game.S.stats.casinoNet || 0) >= 1e6) call('achieve', 'cas_net1m');
    return net;
  }

  function winFX(node, net, mult) {
    const p = centerOf(node);
    if (net > 0) {
      call('float', p.x, p.y - 30, '+' + CO(net), '#8be28f');
      fxBurst(p.x, p.y, { n: mult >= 10 ? 40 : 14, emoji: mult >= 10 ? ['🪙', '💰', '✨'] : '🪙', speed: mult >= 10 ? 320 : 200, size: 16 });
      if (mult >= 10) { fxShower(mult >= 50 ? 2 : 1); call('shake', mult >= 50 ? 8 : 4); }
    } else if (net === 0) {
      call('float', p.x, p.y - 30, 'PUSH — bet returned', '#ffd466');
    } else {
      call('float', p.x, p.y - 30, '-' + CO(-net), '#ff6f6f');
    }
  }

  function settlePending(instant, silent) {
    if (!Game.S) return;
    const c = C(), p = c.pending;
    if (!p) return;
    c.pending = null;
    if (p.g === 'slots') finishSlots(p, instant, silent);
    else if (p.g === 'derby') finishDerby(p, instant, silent);
    else if (p.g === 'wheel') finishWheel(p, instant, silent);
  }

  /* ================= SLOTS ================= */
  // Royal Jackpot = progressive pot (fed by bets) + a house bonus that keeps pace with the economy.
  // Odds of 👑👑👑 are 1 in 39,304, so the bonus adds at most ~2.5% RTP even at the full-pot bet.
  function jackpotBonus() {
    const inc = Math.max(0, Game.income('coins') || 0);
    return Math.max(inc * JP_BONUS_SECS, coins() * 0.05);
  }
  function jackpotPot() { return (C().jackpot || JP_SEED) + jackpotBonus(); }

  function spinSlots() {
    const c = C();
    if (c.pending || slotAnim) return;
    const t = takeBet(currentBet());
    if (!t) { autoLeft = 0; return; }
    const b = t.bet;
    c.jackpot += b * JP_RATE;
    const r = [rollSym(), rollSym(), rollSym()];
    const ev = evalSpin(r);
    let pay = ev.mult * b, jp = 0;
    if (ev.jackpot) {
      const pot = jackpotPot();
      const share = Math.min(1, (b * JP_ELIG) / pot);
      jp = pot * share;
      c.jackpot = Math.max(JP_SEED, c.jackpot * (1 - share));   // the house bonus is recalculated, never "used up"
      pay += jp;
    }
    c.slotSpins = (c.slotSpins || 0) + 1;
    c.pending = { g: 'slots', bet: b, pay, reels: r, mult: ev.mult, jp, label: ev.label, hits: ev.hits,
      triple: !!ev.triple, jackpot: !!ev.jackpot, spider: !!ev.spider, allIn: t.allIn };
    sfx('spin');
    if (D.machine) { D.machine.classList.remove('cas-won', 'cas-bigwon'); D.machine.classList.add('cas-spinning'); }
    setHTML(D.slotResult, '<span class="muted">Spinning…</span>');
    startReelAnim(r);
  }

  function symDiv(i) { return `<div class="cas-sym" data-s="${i}">${SYMS[i].e}</div>`; }

  function startReelAnim(final) {
    if (!D.reels) { slotAnim = null; settlePending(true); return; }
    const h = D.reels[0].clientHeight / 3 || 72;
    const rm = reduce();
    slotAnim = { t: 0, reels: [] };
    for (let r = 0; r < 3; r++) {
      const top = rollSym(), bot = rollSym();
      const n = rm ? 2 + r : 16 + r * 7;
      const mids = [];
      for (let k = 0; k < n; k++) mids.push(rollSym());
      // strip top->bottom: pad, final(top, mid, bot), randoms, current(top, mid, bot)
      const seq = [rollSym(), top, final[r], bot, ...mids, ...reelShown[r]];
      const strip = D.strips[r];
      strip.innerHTML = seq.map(symDiv).join('');
      const startY = -(seq.length - 3) * h, endY = -h;
      strip.style.transform = `translateY(${startY}px)`;
      D.reels[r].classList.add('cas-blur');
      D.reels[r].classList.remove('cas-stop');
      slotAnim.reels.push({ strip, startY, endY, dur: rm ? 0.12 + r * 0.08 : 1.0 + r * 0.42, done: false, reel: D.reels[r] });
      reelShown[r] = [top, final[r], bot];
    }
  }

  function stepSlots(dt) {
    if (!slotAnim) return;
    slotAnim.t += dt;
    let all = true;
    for (const R of slotAnim.reels) {
      if (R.done) continue;
      const p = Math.min(1, slotAnim.t / R.dur);
      const y = R.startY + (R.endY - R.startY) * easeOutBack(p);
      R.strip.style.transform = `translateY(${y}px)`;
      if (p > 0.8) R.reel.classList.remove('cas-blur');
      if (p >= 1) {
        R.done = true;
        R.strip.style.transform = `translateY(${R.endY}px)`;
        R.reel.classList.add('cas-stop');
        sfx('tick');
      } else all = false;
    }
    if (all) { slotAnim = null; settlePending(false); }
  }

  function snapReels() {
    if (!slotAnim) return;
    for (const R of slotAnim.reels) {
      R.strip.style.transform = `translateY(${R.endY}px)`;
      R.reel.classList.remove('cas-blur');
    }
    slotAnim = null;
  }

  function finishSlots(p, instant, silent) {
    snapReels();
    if (D.machine) D.machine.classList.remove('cas-spinning');
    const net = applyResult(p.bet, p.pay, p.allIn);
    const c = C();
    if (p.triple) call('achieve', 'cas_triple');
    if (p.jackpot) call('achieve', 'cas_jackpot');
    if (p.spider) call('achieve', 'cas_spider');
    if ((c.slotSpins || 0) >= 100) call('achieve', 'cas_spins100');
    // highlight winning symbols (the middle row is child index 2 of each strip)
    if (D.strips && p.mult + p.jp > 0) {
      for (const i of p.hits || []) {
        const s = D.strips[i] && D.strips[i].children[2];
        if (s) s.classList.add('cas-hit');
      }
    }
    const effMult = p.pay / p.bet;
    if (p.pay > 0) {
      const big = effMult >= 10;
      setHTML(D.slotResult, `<span class="cas-win-txt${big ? ' big' : ''}">${U.escapeHTML(p.label)} ${p.jackpot ? '' : '×' + F(p.mult)}</span> <b class="good">+${CO(p.pay)}</b>`);
      if (D.machine) D.machine.classList.add(big ? 'cas-bigwon' : 'cas-won');
    } else {
      setHTML(D.slotResult, p.spider ? `<span class="bad">${p.label}</span>` : `<span class="muted">${U.pick(['No luck.', 'So close!', 'The hive hums sympathetically.', 'Nothing. Try again?', 'The reels say no.'])}</span>`);
    }
    if (p.jackpot) {
      call('log', `👑 <b>ROYAL JACKPOT!</b> The Waggle Lounge pays out <b>${CO(p.pay)}</b>!`, 'royal');
      call('news', `Royal Jackpot hit at the Waggle Lounge — one lucky bee walks away with ${CO(p.pay)}.`);
      call('toast', `<b>ROYAL JACKPOT!</b> +${CO(p.pay)}`, 'royal', '👑');
    } else if (effMult >= 25) {
      call('log', `🎰 Honey Slots: <b>${U.escapeHTML(p.label)}</b> pays ×${F(p.mult)} — <b>+${CO(p.pay)}</b>`, 'good');
    }
    if (!silent && !instant) {
      if (p.jackpot) {
        sfx('jackpot'); call('flash', '#ffe27a'); call('shake', 12); fxShower(3);
        winFX(D.spinBtn, net, 100);
      } else if (p.pay > 0) {
        sfx(effMult >= 10 ? 'bigwin' : effMult > 1 ? 'win' : 'coin');
        winFX(D.spinBtn, net, effMult);
      } else {
        sfx('lose');
      }
      if (autoLeft > 0) { autoLeft--; autoTimer = reduce() ? 0.15 : 0.45; }
    } else {
      autoLeft = 0;
      if (instant && !silent) call('toast', `Honey Slots: ${p.pay > 0 ? 'won ' + CO(p.pay) : 'no win'}`, p.pay > 0 ? 'good' : 'info', '🎰');
    }
  }

  function stepAuto(dt) {
    if (autoLeft <= 0 || slotAnim || C().pending) return;
    if (C().sub !== 'slots') { autoLeft = 0; return; }
    autoTimer -= dt;
    if (autoTimer > 0) return;
    if (!canBet(currentBet())) { autoLeft = 0; return; }
    spinSlots();
  }

  /* ================= DERBY ================= */
  // A bee's race = its progress curve (0→1) stretched over its finish time. Many short segments with
  // surges and stumbles make the lead swap back and forth; the outcome is still decided at bet time.
  function makeCurve(kind) {
    const K = 18, w = [];
    for (let k = 0; k < K; k++) w.push(U.rand(0.5, 1.5));
    for (let b = 0; b < 3; b++) w[U.randInt(1, K - 1)] *= U.rand(1.4, 2.0);   // speed bursts
    for (let b = 0; b < 2; b++) w[U.randInt(1, K - 2)] *= U.rand(0.5, 0.7);   // stumbles
    if (kind === 'comeback') { for (let k = 0; k < K; k++) w[k] *= k < 8 ? 0.8 : k >= 13 ? 1.35 : 1; }   // slow start, late charge
    if (kind === 'fader') { for (let k = 0; k < K; k++) w[k] *= k < 7 ? 1.3 : k >= 13 ? 0.8 : 1; }       // flies out, tires late
    if (kind === 'surger') { for (let k = 0; k < K; k++) w[k] *= k >= 12 && k < 17 ? 1.4 : 0.95; }       // late challenge that falls short
    const cum = [0];
    for (let k = 0; k < K; k++) cum.push(cum[k] + w[k]);
    const tot = cum[K];
    const S = 180, arr = new Float32Array(S + 1);
    for (let j = 0; j <= S; j++) {
      const x = (j / S) * K, k = Math.min(K - 1, Math.floor(x)), f = x - k;
      arr[j] = (cum[k] + (cum[k + 1] - cum[k]) * f) / tot;
    }
    for (let pass = 0; pass < 3; pass++) {
      let prev = arr[0];
      for (let j = 1; j < S; j++) { const cur = arr[j]; arr[j] = (prev + 2 * cur + arr[j + 1]) / 4; prev = cur; }
    }
    // pull every bee a little toward an even pace so the pack stays bunched (more neck-and-neck moments)
    for (let j = 0; j <= S; j++) arr[j] = arr[j] * 0.7 + (j / S) * 0.3;
    arr[0] = 0; arr[S] = 1;
    return arr;
  }
  function sampleCurve(arr, x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    const S = arr.length - 1, f = x * S, j = Math.floor(f);
    return arr[j] + (arr[j + 1] - arr[j]) * (f - j);
  }

  function startRace() {
    const c = C();
    if (!unlocked('derby') || c.pending || (race && !race.done)) return;
    const field = c.derby.field;
    const pick = c.derby.pick;
    if (!field || pick < 0 || pick >= field.length) { sfx('error'); call('toast', 'Pick a bee first!', 'bad', '🐝'); return; }
    const t = takeBet(currentBet());
    if (!t) return;
    // decide winner from true probabilities
    let r = Math.random(), winner = field.length - 1;
    for (let i = 0; i < field.length; i++) { r -= field[i].p; if (r < 0) { winner = i; break; } }
    const photo = Math.random() < 0.22;
    const won = winner === pick;
    const odds = field[pick].odds;
    c.derby.n = (c.derby.n || 0) + 1;
    c.pending = { g: 'derby', bet: t.bet, pay: won ? t.bet * odds : 0, pick, winner, odds, photo, allIn: t.allIn,
      name: field[pick].name, wname: field[winner].name };
    planRace(field, winner, photo);
    sfx('whoosh');
    commentary("And they're off! 🏁");
  }

  function planRace(field, winner, photo) {
    const dur = reduce() ? 3.6 : U.rand(12.3, 15.3);   // 50% longer than the original 8.2–10.2 s
    const n = field.length;
    const fins = new Array(n);
    fins[winner] = dur;
    const others = [];
    for (let i = 0; i < n; i++) if (i !== winner) others.push({ i, key: field[i].p * U.rand(0.4, 1.6) });
    others.sort((a, b) => b.key - a.key);
    // a tight finish: the pack crosses close behind the winner
    let tc = dur;
    others.forEach((o, k) => {
      const gap = k === 0 ? (photo ? U.rand(0.01, 0.035) : U.rand(0.06, 0.3)) : U.rand(0.04, 0.4);
      tc += gap * (dur / 13.8);
      fins[o.i] = tc;
    });
    // the winner often hides in the pack and charges late; one or two rivals mount late challenges
    const rivals = new Set(others.slice(0, 2).map((o) => o.i));
    const curves = field.map((f, i) => {
      const r = Math.random();
      if (i === winner) return makeCurve(r < 0.45 ? 'comeback' : r < 0.6 ? 'surger' : 'normal');
      if (rivals.has(i)) return makeCurve(r < 0.5 ? 'surger' : r < 0.75 ? 'fader' : 'normal');
      return makeCurve(r < 0.45 ? 'fader' : 'normal');
    });
    race = { t: 0, dur, fins, curves, winner, photo, done: false, settled: false, leader: -1, leadT: 0, stretch: false,
      field: field.map((f) => ({ name: f.name, col: f.col })), maxT: Math.max(...fins) + 0.4, pick: C().derby.pick };
  }

  function raceProg(i, t) {
    const fin = race.fins[i];
    if (t <= fin) return sampleCurve(race.curves[i], t / fin);
    return 1 + Math.min(0.1, (t - fin) * 0.06);
  }

  function stepRace(dt) {
    if (!race || race.done) return;
    race.t += dt;
    const t = race.t;
    // leader / commentary
    let lead = 0, best = -1, second = -1;
    for (let i = 0; i < race.field.length; i++) {
      const p = raceProg(i, t);
      if (p > best) { second = best; best = p; lead = i; } else if (p > second) second = p;
    }
    race.leadT -= dt;
    race.neckT = (race.neckT || 0) - dt;
    if (!race.settled) {
      if (lead !== race.leader && t > 0.9 && race.leadT <= 0) {
        race.leader = lead; race.leadT = 1.1;
        commentary(U.pick(['{n} takes the lead!', '{n} pulls ahead!', 'Here comes {n}!', '{n} hits the front!', 'What a move by {n}!',
          '{n} surges on the outside!', '{n} squeezes through the gap!', 'Now it’s {n} in front!']).replace('{n}', race.field[lead].name));
      } else if (best - second < 0.012 && best > 0.25 && best < 0.95 && race.neckT <= 0 && race.leadT <= 0) {
        race.neckT = 3.2;
        commentary(U.pick(['Neck and neck!', 'It’s anyone’s race!', 'Wing to wing down the track!', 'Nothing in it between the leaders!', 'They’re bunched up — who wants it more?']));
      }
      if (!race.stretch && best > 0.78) { race.stretch = true; commentary(`Into the final stretch — ${race.field[lead].name} leads!`); }
      if (t >= race.fins[race.winner] + (reduce() ? 0.2 : 0.55)) { race.settled = true; settlePending(false); }
    }
    if (t >= race.maxT) race.done = true;
  }

  function finishDerby(p, instant, silent) {
    const c = C();
    if (race && !race.settled) { race.settled = true; race.t = Math.max(race.t, race.maxT); race.done = true; }
    const net = applyResult(p.bet, p.pay, p.allIn);
    const won = p.pay > 0;
    if (won) {
      call('achieve', 'cas_derby');
      if (p.odds >= 8) call('achieve', 'cas_longshot');
      if (p.photo) call('achieve', 'cas_photo');
    }
    const head = p.photo ? `📸 PHOTO FINISH! ${p.wname} by a whisker!` : `🏆 ${p.wname} wins!`;
    commentary(head + (won ? `  Your bet pays ×${p.odds}!` : `  (You backed ${p.name}.)`));
    setHTML(D.derbyResult, won
      ? `<span class="cas-win-txt">${U.escapeHTML(p.wname)} wins!</span> <b class="good">+${CO(p.pay)}</b>`
      : `<span class="muted">${U.escapeHTML(p.wname)} won. ${U.escapeHTML(p.name)} will remember this.</span>`);
    if (won && p.odds >= 8) {
      call('log', `🏁 Bee Derby: <b>${U.escapeHTML(p.wname)}</b> wins at <b>${p.odds}x</b> — you collect <b>${CO(p.pay)}</b>!`, 'good');
      call('news', `${p.wname} stuns the Bee Derby at ${p.odds}x odds. Bookies "buzzing with rage".`);
    }
    if (!silent && !instant) {
      if (won) { sfx(p.odds >= 8 ? 'bigwin' : 'win'); winFX(D.raceBtn, net, p.odds); }
      else sfx('lose');
    } else if (instant && !silent) {
      call('toast', `Bee Derby: ${p.wname} won — ${won ? '+' + CO(p.pay) : 'your bee lost'}`, won ? 'good' : 'info', '🏁');
    }
    c.derby.field = newField();
    c.derby.pick = -1;
    renderField();
  }

  function commentary(s) { setText(D.commentary, '🎙️ ' + s); }

  const LANE_TRAIL = LANE_COLS.map((c) => c + '55');
  const derbyBg = { cv: null, ctx: null, key: '' };
  const BEE_HALO = 'rgba(255,226,122,.28)';

  function drawBee(ctx, x, y, s, col, t, seed, glow) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(t * 9 + seed) * 0.08);
    if (glow) { // cheap halo instead of shadowBlur
      ctx.fillStyle = BEE_HALO;
      ctx.beginPath(); ctx.arc(0, -s * 0.15, s * 1.15, 0, TAU); ctx.fill();
    }
    const flap = 0.45 + 0.55 * Math.abs(Math.sin(t * 34 + seed));
    ctx.fillStyle = 'rgba(225,242,255,.55)';
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(-s * 0.12, -s * 0.58, s * 0.42, s * 0.3 * flap + 0.5, -0.45, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(s * 0.16, -s * 0.52, s * 0.32, s * 0.24 * flap + 0.5, 0.45, 0, TAU); ctx.fill(); ctx.stroke();
    // stinger
    ctx.fillStyle = '#2a1a06';
    ctx.beginPath(); ctx.moveTo(-s * 0.58, -s * 0.07); ctx.lineTo(-s * 0.9, 0); ctx.lineTo(-s * 0.58, s * 0.09); ctx.fill();
    // body + stripes (stripes drawn as filled ellipse slices: no clip/save needed)
    ctx.fillStyle = '#ffcd2e';
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.64, s * 0.43, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2a1a06';
    ctx.beginPath(); ctx.ellipse(-s * 0.27, 0, s * 0.085, s * 0.39, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.05, 0, s * 0.085, s * 0.43, 0, 0, TAU); ctx.fill();
    ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(42,26,6,.8)';
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.64, s * 0.43, 0, 0, TAU); ctx.stroke();
    // jockey saddle
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(s * 0.24, -s * 0.2, s * 0.17, s * 0.12, 0, 0, TAU); ctx.fill();
    // head
    ctx.fillStyle = '#2a1a06';
    ctx.beginPath(); ctx.arc(s * 0.66, -s * 0.03, s * 0.27, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s * 0.75, -s * 0.1, s * 0.075, 0, TAU); ctx.fill();
    // antennae
    ctx.strokeStyle = '#2a1a06'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(s * 0.7, -s * 0.26); ctx.quadraticCurveTo(s * 0.86, -s * 0.62, s * 1.02, -s * 0.55); ctx.stroke();
    ctx.restore();
  }

  const DERBY_TOP = 12, DERBY_BOT = 12, DERBY_X0 = 46;
  /** turf, lanes, flowers, markers, start/finish and lane badges — rebuilt only when the canvas size changes */
  function buildDerbyBg(f, n) {
    const key = f.W + 'x' + f.H + ':' + n;
    if (derbyBg.key === key && derbyBg.cv) return;
    derbyBg.key = key;
    const ctx = layer(derbyBg, f.W, f.H);
    const { w, h } = f;
    ctx.setTransform(f.dpr, 0, 0, f.dpr, 0, 0);
    const laneH = (h - DERBY_TOP - DERBY_BOT) / n, x0 = DERBY_X0, x1 = w - 30;
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#1d3f1f'); g.addColorStop(1, '#122914');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.1)';
      ctx.fillRect(0, DERBY_TOP + i * laneH, w, laneH);
    }
    const rnd = U.seeded(7), cols = ['#ff9ec7', '#ffe066', '#ffffff', '#c3a6ff'];
    for (let k = 0; k < Math.floor(w / 18); k++) {
      ctx.fillStyle = cols[Math.floor(rnd() * 4)];
      ctx.beginPath(); ctx.arc(rnd() * w, 5 + rnd() * 4, 2, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(rnd() * w, h - 5 - rnd() * 4, 2, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
    for (let q = 1; q < 4; q++) { const x = x0 + ((x1 - x0) * q) / 4; ctx.beginPath(); ctx.moveTo(x, DERBY_TOP); ctx.lineTo(x, h - DERBY_BOT); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(x0, DERBY_TOP, 2, h - DERBY_TOP - DERBY_BOT);
    const sq = 5;
    for (let yy = DERBY_TOP, r = 0; yy < h - DERBY_BOT; yy += sq, r++) {
      for (let cc = 0; cc < 2; cc++) { ctx.fillStyle = (r + cc) % 2 ? '#111' : '#f5f5f5'; ctx.fillRect(x1 + cc * sq, yy, sq, Math.min(sq, h - DERBY_BOT - yy)); }
    }
    ctx.font = '700 11px Nunito, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      const cy = DERBY_TOP + i * laneH + laneH / 2;
      ctx.fillStyle = LANE_COLS[i % LANE_COLS.length];
      ctx.beginPath(); ctx.arc(18, cy, 9, 0, TAU); ctx.fill();
      ctx.fillStyle = '#1a1206'; ctx.fillText(String(i + 1), 18, cy + 0.5);
    }
  }

  function drawDerby(dt) {
    const f = fit(D.derbyCv);
    if (!f) return;
    const { ctx, w, h } = f;
    derbyIdleT += dt;
    const field = race ? race.field : (C().derby.field || []);
    const n = Math.max(1, field.length);
    buildDerbyBg(f, n);
    ctx.drawImage(derbyBg.cv, 0, 0, w, h);
    const laneH = (h - DERBY_TOP - DERBY_BOT) / n, x0 = DERBY_X0, x1 = w - 30;
    const s = Math.min(laneH * 0.42, 15);
    const t = race ? race.t : 0;
    let leadIdx = -1, leadP = -1;
    if (race) for (let i = 0; i < n; i++) { const p = raceProg(i, t); if (p > leadP) { leadP = p; leadIdx = i; } }
    const myPick = race ? race.pick : C().derby.pick;
    for (let i = 0; i < n; i++) {
      const b = field[i];
      if (!b) continue;
      const cy = DERBY_TOP + i * laneH + laneH / 2;
      const p = race ? raceProg(i, t) : 0;
      const x = race ? x0 + p * (x1 - x0) : x0 - 6 + Math.sin(derbyIdleT * 2 + i) * 3;
      const y = cy + Math.sin(derbyIdleT * 5 + i * 1.7) * 2.5;
      if (race && p > 0.01) {
        const len = Math.min(46, x - x0);
        ctx.fillStyle = LANE_TRAIL[i % LANE_TRAIL.length];
        ctx.fillRect(x - len, y - 1.5, len, 3);
        ctx.fillRect(x - len * 0.5, y - 2.5, len * 0.5, 5);
      }
      if (i === myPick) {
        ctx.strokeStyle = '#ffd466'; ctx.lineWidth = 1.5; ctx.setLineDash(DASH);
        ctx.beginPath(); ctx.arc(x, y, s + 6, 0, TAU); ctx.stroke(); ctx.setLineDash(NO_DASH);
      }
      drawBee(ctx, x, y, s, b.col, derbyIdleT, i * 2.1, race && i === leadIdx && !race.settled);
    }
    if (race && race.settled) {
      if (!race.banner) {
        race.banner = (race.photo ? '📸 PHOTO FINISH — ' : '🏆 ') + race.field[race.winner].name + ' wins!';
        race.bannerFont = '700 ' + Math.round(Math.max(14, Math.min(22, w / 28))) + 'px Fredoka, Nunito, system-ui, sans-serif';
      }
      ctx.font = race.bannerFont;
      if (!race.bannerW) race.bannerW = ctx.measureText(race.banner).width + 30;
      const tw = race.bannerW, bx = w / 2 - tw / 2, by = h / 2 - 20;
      ctx.fillStyle = 'rgba(0,0,0,.65)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx, by, tw, 40, 12); else ctx.rect(bx, by, tw, 40);
      ctx.fill();
      ctx.strokeStyle = '#ffd466'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#ffe9a8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(race.banner, w / 2, h / 2 + 1);
    }
  }

  /* ================= COMB CARDS (HI-LO) ================= */
  function hiloDeal() {
    const c = C(), h = c.hilo;
    if (h.active || !unlocked('hilo')) return;
    const t = takeBet(currentBet());
    if (!t) return;
    h.active = true; h.bet = t.bet; h.pot = t.bet; h.streak = 0; h.skips = HILO_SKIPS; h.allIn = t.allIn;
    h.card = U.randInt(1, 13); h.suit = U.randInt(0, 3); h.hist = [];
    c.hiloRounds = (c.hiloRounds || 0) + 1;
    sfx('whoosh');
    hiloMsg('Higher or lower? Ties are a push.', '');
    renderHilo(true);
  }
  function hiloGuess(dir) {
    const c = C(), h = c.hilo;
    if (!h.active) return;
    const m = hiloMult(h.card, dir);
    if (m <= 0) return;
    const prev = h.card;
    const nc = U.randInt(1, 13), ns = U.randInt(0, 3);
    h.hist.push({ card: prev, suit: h.suit });
    if (h.hist.length > 12) h.hist.shift();
    h.card = nc; h.suit = ns;
    if (nc === prev) {
      sfx('tick');
      hiloMsg(`Tie at ${RANKS[nc - 1]} — push! Pot unchanged.`, '');
      renderHilo(true);
      return;
    }
    const win = dir === 'hi' ? nc > prev : nc < prev;
    if (win) {
      h.pot *= m; h.streak++;
      if (h.streak > (c.bestHilo || 0)) c.bestHilo = h.streak;
      if (h.streak >= 5) call('achieve', 'cas_hilo5');
      if (h.streak >= 10) {
        call('achieve', 'cas_hilo10');
        if (h.streak === 10) call('news', 'Card-counting bee asked to leave the Comb Cards table after 10 straight wins.');
      }
      sfx(h.streak >= 5 ? 'levelup' : 'coin');
      hiloMsg(`${RANKS[nc - 1]}! Correct ×${m.toFixed(2)} — streak ${h.streak}.`, 'good');
      const p = centerOf(D.card);
      call('float', p.x, p.y - 60, '×' + m.toFixed(2), '#8be28f');
      renderHilo(true, 'win');
    } else {
      h.active = false;
      applyResult(h.bet, 0, h.allIn);
      sfx('lose');
      hiloMsg(`${RANKS[nc - 1]}… wrong! You lose ${CO(h.bet)}.`, 'bad');
      call('shake', 3);
      renderHilo(true, 'lose');
    }
  }
  function hiloSkip() {
    const h = C().hilo;
    if (!h.active || h.skips <= 0) return;
    h.skips--;
    h.hist.push({ card: h.card, suit: h.suit, skip: true });
    if (h.hist.length > 12) h.hist.shift();
    h.card = U.randInt(1, 13); h.suit = U.randInt(0, 3);
    sfx('whoosh');
    hiloMsg(`Skipped. ${h.skips} skip${h.skips === 1 ? '' : 's'} left.`, '');
    renderHilo(true);
  }
  function hiloCash() {
    const c = C(), h = c.hilo;
    if (!h.active) return;
    h.active = false;
    const net = applyResult(h.bet, h.pot, h.allIn);
    if (h.streak >= 5) call('log', `🃏 Comb Cards: cashed out a <b>${h.streak}-streak</b> for <b>${CO(h.pot)}</b>.`, 'good');
    hiloMsg(net > 0 ? `Cashed out ${CO(h.pot)} (+${F(net)}).` : `Folded. ${CO(h.pot)} returned.`, net > 0 ? 'good' : '');
    if (net > 0) { sfx(net >= h.bet * 9 ? 'bigwin' : 'win'); winFX(D.hiCash, net, h.pot / h.bet); }
    else sfx('coin');

  /* ================= LUCKY CLOVER WHEEL ================= */
  function lastWheel() { const v = C().lastWheel; return typeof v === 'number' && Number.isFinite(v) ? v : -1e9; }
  function wheelReady() { return gtime() - lastWheel() >= WHEEL_COOLDOWN; }
  function wheelLeft() { return Math.max(0, WHEEL_COOLDOWN - (gtime() - lastWheel())); }

  function wheelReward(seg) {
    const inc = Math.max(0, Game.income('coins') || 0), bank = coins();
    const coinsFor = (sec, min) => Math.max(min, inc * sec, (bank * sec) / 18000);
    const p3 = Game.phase() === 3;
    const rush = p3 ? { id: 'stardustrush', label: 'Stardust Storm', icon: '✨', secs: 30, mult: { stardust: 5 } }
      : { id: 'frenzy', label: 'Honey Rush', icon: '🍯', secs: 30, mult: { honey: 7 } };
    const boom = p3 ? { id: 'warpwind', label: 'Warp Tailwind', icon: '🚀', secs: 30, mult: { ships: 3 } }
      : { id: 'pricebuff', label: 'Market Boom', icon: '📈', secs: 30, mult: { price: 3 } };
    switch (seg.id) {
      case 'c2': return { kind: 'coins', amt: coinsFor(90, 40) };     // 1.5 min of income
      case 'c5': return { kind: 'coins', amt: coinsFor(180, 100) };   // 3 min
      case 'c10': return { kind: 'coins', amt: coinsFor(360, 250) };  // 6 min
      case 'wag': return { kind: 'waggle', amt: Math.max(10, (Game.income('waggle') || 0) * 180) };
      case 'j1': return { kind: 'jelly', amt: 1 };
      case 'j3': return { kind: 'jelly', amt: 3 };
      case 'rush': return { kind: 'buff', buff: rush };
      case 'boom': return { kind: 'buff', buff: boom };
      case 'fever': return { kind: 'buff', buff: { id: 'clickfrenzy', label: 'Click Fever', icon: '👆', secs: 15, mult: { click: 15 } } };
      case 'jp': return { kind: 'jackpot', amt: coinsFor(2700, 25000), jelly: 15, buff: rush }; // 45 min + jelly + rush
      default: return { kind: 'coins', amt: 50 };
    }
  }

  function segAt(localAngle) {
    let a = ((localAngle % TAU) + TAU) % TAU;
    for (let i = 0; i < WHEEL.length; i++) {
      const span = (WHEEL[i].w / WHEEL_TOTAL) * TAU;
      if (a < span) return i;
      a -= span;
    }
    return WHEEL.length - 1;
  }

  function spinWheel() {
    const c = C();
    if (!unlocked('wheel') || c.pending || wheel.spin || !wheelReady()) return;
    // choose segment by weight
    let r = Math.random() * WHEEL_TOTAL, seg = 0;
    for (let i = 0; i < WHEEL.length; i++) { r -= WHEEL[i].w; if (r < 0) { seg = i; break; } }
    let a0 = 0;
    for (let i = 0; i < seg; i++) a0 += (WHEEL[i].w / WHEEL_TOTAL) * TAU;
    const span = (WHEEL[seg].w / WHEEL_TOTAL) * TAU;
    const target = a0 + span * U.rand(0.18, 0.82);   // local angle that must end under the pointer
    const from = wheel.rot;
    const turns = reduce() ? 1 : U.randInt(5, 7);
    const delta = (((-target - from) % TAU) + TAU) % TAU;
    wheel.spin = { t: 0, dur: reduce() ? 1.0 : U.rand(4.6, 5.6), from, to: from + turns * TAU + delta };
    c.lastWheel = gtime();
    c.wheelSpins = (c.wheelSpins || 0) + 1;
    c.pending = { g: 'wheel', seg, reward: wheelReward(WHEEL[seg]), to: wheel.spin.to };
    call('achieve', 'cas_wheel');
    sfx('whoosh');
    setHTML(D.wheelResult, '<span class="muted">Round and round it goes…</span>');
  }

  function stepWheel(dt) {
    if (wheel.spin) {
      const S = wheel.spin;
      S.t += dt;
      const p = Math.min(1, S.t / S.dur);
      wheel.rot = S.from + (S.to - S.from) * easeOutQuart(p);
      const si = segAt(-wheel.rot);
      wheel.tickT -= dt;
      if (si !== wheel.lastSeg) {
        wheel.lastSeg = si;
        if (wheel.tickT <= 0) { sfx('tick'); wheel.tickT = 0.045; }
        wheel.kick = 1;
      }
      wheel.dirty = true;
      if (p >= 1) { wheel.spin = null; settlePending(false); }
    } else if (unlocked('wheel') && wheelReady() && !reduce() && gfx().idle > 0) {
      wheel.rot += dt * 0.25; wheel.dirty = true; wheel.idle = true;
    }
    // pointer flick when a peg passes (inline transform, no forced reflow)
    if (wheel.kick > 0 && D.pointer) {
      wheel.kick = Math.max(0, wheel.kick - dt * 9);
      D.pointer.style.transform = wheel.kick > 0 ? 'rotate(' + (-14 * wheel.kick).toFixed(1) + 'deg)' : '';
    }
  }

  function applyReward(rw) {
    let txt = '';
    switch (rw.kind) {
      case 'coins': Game.add('coins', rw.amt); txt = `+${CO(rw.amt)}`; break;
      case 'waggle': Game.add('waggle', rw.amt); txt = `+💫 ${F(rw.amt)} Waggle`; break;
      case 'jelly': Game.add('jelly', rw.amt); txt = `+👑 ${rw.amt} Royal Jelly`; break;
      case 'buff': Game.buff(rw.buff); txt = `${rw.buff.icon} ${rw.buff.label} for ${rw.buff.secs}s!`; break;
      case 'jackpot':
        Game.add('coins', rw.amt); Game.add('jelly', rw.jelly); Game.buff(rw.buff);
        txt = `JACKPOT! +${CO(rw.amt)}, +👑 ${rw.jelly}, and ${rw.buff.label}!`;
        break;
      default: break;
    }
    return txt;
  }

  function finishWheel(p, instant, silent) {
    wheel.spin = null;
    if (typeof p.to === 'number') wheel.rot = p.to;
    wheel.dirty = true;
    const seg = WHEEL[p.seg] || WHEEL[0];
    const txt = applyReward(p.reward);
    setHTML(D.wheelResult, `<span class="cas-win-txt">${seg.icon} ${U.escapeHTML(seg.label)}</span> <b class="good">${U.escapeHTML(txt)}</b>`);
    if (seg.id === 'jp') {
      call('achieve', 'cas_wheeljp');
      call('log', `🍀 The Lucky Clover Wheel lands on <b>JACKPOT</b>! ${U.escapeHTML(txt)}`, 'royal');
    }
    if (!silent && !instant) {
      if (seg.id === 'jp') { sfx('jackpot'); call('flash', '#9cf0a8'); fxShower(2); call('shake', 8); }
      else sfx(p.reward.kind === 'buff' ? 'levelup' : 'win');
      const pt = centerOf(D.wheelCv);
      fxBurst(pt.x, pt.y, { n: seg.id === 'jp' ? 50 : 18, emoji: ['🍀', seg.icon, '✨'], speed: 260, size: 16 });
      call('toast', `Lucky Clover Wheel: <b>${U.escapeHTML(txt)}</b>`, seg.id === 'jp' ? 'royal' : 'good', '🍀');
    } else if (instant && !silent) {
      call('toast', `Lucky Clover Wheel: <b>${U.escapeHTML(txt)}</b>`, 'good', '🍀');
    }
  }

  const wheelFace = { cv: null, ctx: null, key: '' };
  /** the whole wheel (rim, segments, labels, pegs, hub) pre-rendered once per size; frames just rotate it */
  function buildWheelFace(size, dpr) {
    const W = Math.round(size * dpr), key = String(W);
    if (wheelFace.key === key && wheelFace.cv) return;
    wheelFace.key = key;
    const ctx = layer(wheelFace, W, W);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    const R = size / 2 - 10;
    ctx.translate(size / 2, size / 2);
    const rim = ctx.createRadialGradient(0, 0, R * 0.9, 0, 0, R + 9);
    rim.addColorStop(0, '#5a3a0a'); rim.addColorStop(0.6, '#ffd466'); rim.addColorStop(1, '#7a4b00');
    ctx.fillStyle = rim;
    ctx.beginPath(); ctx.arc(0, 0, R + 9, 0, TAU); ctx.fill();
    let a = 0;
    WHEEL.forEach((s) => {
      const span = (s.w / WHEEL_TOTAL) * TAU;
      const a0 = -Math.PI / 2 + a, a1 = a0 + span, am = a0 + span / 2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, a0, a1); ctx.closePath();
      const g = ctx.createRadialGradient(0, 0, R * 0.12, 0, 0, R);
      g.addColorStop(0, shade(s.col, -0.45)); g.addColorStop(0.7, s.col); g.addColorStop(1, shade(s.col, 0.25));
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = 'rgba(30,18,0,.55)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.save();
      ctx.rotate(am); ctx.translate(R * 0.8, 0); ctx.rotate(Math.PI / 2);
      ctx.font = `${Math.max(12, Math.min(22, R * 0.13))}px ${EMOJI_FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(s.icon, 0, 0);
      ctx.restore();
      if (span > 0.42) {
        ctx.save();
        ctx.rotate(am);
        ctx.font = `800 ${Math.max(9, Math.min(13, R * 0.075))}px Nunito, system-ui, sans-serif`;
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.5)';
        ctx.strokeText(s.label.toUpperCase(), R * 0.66, 0);
        ctx.fillStyle = 'rgba(255,255,255,.96)';
        ctx.fillText(s.label.toUpperCase(), R * 0.66, 0);
        ctx.restore();
      }
      a += span;
    });
    a = 0;
    ctx.fillStyle = '#fff6d0';
    WHEEL.forEach((s) => {
      const ang = -Math.PI / 2 + a;
      ctx.beginPath(); ctx.arc(Math.cos(ang) * (R + 2), Math.sin(ang) * (R + 2), 3, 0, TAU); ctx.fill();
      a += (s.w / WHEEL_TOTAL) * TAU;
    });
    const hub = ctx.createRadialGradient(-R * 0.04, -R * 0.05, 2, 0, 0, R * 0.2);
    hub.addColorStop(0, '#fff3c4'); hub.addColorStop(1, '#c98a00');
    ctx.fillStyle = hub;
    ctx.beginPath(); ctx.arc(0, 0, R * 0.18, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#5a3a0a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = `${R * 0.18}px ${EMOJI_FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🍀', 0, 1);
  }

  function drawWheel() {
    const f = fit(D.wheelCv);
    if (!f) return;
    const { ctx, w, h } = f;
    const size = Math.min(w, h);
    buildWheelFace(size, f.dpr);
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(wheel.rot);
    ctx.drawImage(wheelFace.cv, -size / 2, -size / 2, size, size);
    ctx.restore();
    wheel.dirty = false;
  }

  /* ---------------- frame (every rAF, capped by graphics quality) ---------------- */
  function frame(dt) {
    if (!mounted || !Game.S || Game.activeTab !== 'lounge') { pend = 0; return; }
    dt = Math.min(0.1, Math.max(0, dt || 0.016));
    pend += dt;
    const q = gfx();
    if (q.fps > 0) {
      gate += dt;
      const iv = 1 / q.fps;
      if (gate < iv) return;
      gate -= iv;
      if (gate > iv) gate = 0;
    }
    const d = Math.min(0.1, pend);
    pend = 0;
    stepSlots(d);
    stepAuto(d);
    stepRace(d);
    stepWheel(d);
    const sub = C().sub;
    if (!unlocked(sub)) return;
    if (sub === 'derby') {
      if (race && !race.done) { drawDerby(d + idleAcc); idleAcc = 0; derbyDirty = false; }
      else {
        idleAcc += d;
        if (derbyDirty || (q.idle > 0 && idleAcc >= 1 / q.idle)) { drawDerby(idleAcc); idleAcc = 0; derbyDirty = false; }
      }
    } else if (sub === 'wheel' && wheel.dirty) {
      if (wheel.spin || wheel.kick > 0 || !wheel.idle) { drawWheel(); wIdle = 0; }
      else {
        wIdle += d;
        if (q.idle <= 0 || wIdle >= 1 / q.idle) { drawWheel(); wIdle = 0; }
      }
      wheel.idle = false;
    }
  }

  function onLoad() {
    // drop any visuals from the previous state, then settle a bet that was mid-animation when saved
    slotAnim = null; race = null; wheel.spin = null; wheel.kick = 0; autoLeft = 0; session = 0;
    const c = C();
    if (!c.seen) c.seen = {};
    if (!Array.isArray(c.derby.field) || !c.derby.field.length) c.derby.field = newField();
    if (c.pending) {

    s.realized += pnl;
    s.trades++;
    if (auto) s.algoTrades++;
    if (pnl > (s.bestTrade || 0)) s.bestTrade = pnl;
    Game.stat('stockProfit', pnl);
    Game.stat('stockTrades');
    achieve('stk_first');
    if (s.realized >= 1e3) achieve('stk_1k');
    if (s.realized >= 1e6) achieve('stk_1m');
    if (s.realized >= 1e9) achieve('stk_1b');
    if (sq.avg <= avgCost * 0.5) achieve('stk_paper');
    if (sq.avg >= avgCost * 2) achieve('stk_moonbee');
    if (o.ch && pnl > 0) achieve('stk_diamond');
    if (o.own === 0) o.ch = 0;
    if (s.algoTrades >= 100) achieve('stk_algo');
    return { q, net: sq.net, pnl, avg: sq.avg };
  }

  // ---------- takeovers ----------
  const canTakeover = (o) => !!o && !o.acq && !o.tr && o.own >= o.fl * TAKE_PCT;
  const takeoverFee = (o) => Math.max(0, (o.fl - o.own) * o.p * TAKE_PREMIUM);

  function completeAcquisition(tk, silent) {
    const s = st(), o = s.co[tk], c = BY[tk];
    o.acq = true;
    o.at = s.n;
    if (!silent) {
      Game.sfx('levelup');
      Game.toast(`Acquired ${c.name}! ${c.perk}`, 'good', '🏢');
      if (typeof Game.coinShower === 'function') Game.coinShower(1);
    }
    Game.log(`🏢 Hostile takeover complete: <b>${c.name}</b> is now a subsidiary of the Hive. Perk: ${c.perk}.`, 'good');
    if (typeof Game.news === 'function') Game.news(`🏢 ${c.name} (${tk}) delisted after hostile takeover by "a very organized swarm"`);
    Game.emit('acquired', tk);
    achieve('stk_takeover');
    if (TAKE_CO.every((x) => s.co[x.tk] && s.co[x.tk].acq)) achieve('stk_all');
    ensureSel();
  }

  function takeover(tk) {
    const s = st(), o = s.co[tk];
    if (!canTakeover(o)) return false;
    const fee = takeoverFee(o);
    if (!Game.spend({ coins: fee })) {
      Game.sfx('error');
      Game.toast(`The takeover premium is ${coin(fee)}`, 'bad', '🏢');
      return false;
    }
    completeAcquisition(tk, false);
    ui.forceAll = true;
    return true;
  }

  // ---------- going global (Phase 2) ----------
  function goGlobal(quiet) {
    const s = st();
    if (s.global) return;
    ensure();
    let refund = 0;
    const auto = [];
    for (const c of CO) {
      const o = s.co[c.tk];
      if (o.acq) continue;
      if (!c.trade && o.own >= o.fl * TAKE_PCT) { auto.push(c.tk); continue; }
      const exact = o.own / G_PRICE;
      const whole = Math.floor(exact);
      if (exact > 0) {
        refund += (exact - whole) * o.p * G_PRICE;
        o.cost *= whole / exact;
      }
      o.own = whole;
      if (o.own === 0) o.cost = 0;
      o.p *= G_PRICE;
      o.f *= G_PRICE;
      o.fl *= G_FLOAT;
      o.h = o.h.map((v) => rp(v * G_PRICE));
    }
    s.global = true;
    if (refund > 0) Game.add('coins', refund);
    for (const tk of auto) completeAcquisition(tk, true);
    s.qty = 'max';
    Game.log('📈 <b>The Nectar Exchange goes global.</b> Every company re-lists on the world market: share prices ×4, a thousand times more shares issued. Your holdings keep their value.', 'story');
    if (auto.length) Game.log(`🏢 Your controlling stakes in ${auto.join(', ')} converted into full acquisitions before the re-listing.`, 'good');
    if (!quiet) {
      if (typeof Game.news === 'function') Game.news('📈 The Nectar Exchange re-lists on the world market. Analysts: "It\'s bees all the way down."');

  }

  // ---------- algo trader ----------
  function runAlgo() {
    const s = st(), a = s.algo;
    if (s.upg.trend && a.strat === 'trend') { runTrend(); return; }
    for (const c of CO) {
      const o = s.co[c.tk];
      if (o.acq) continue;
      if (o.own > 0) {
        const avg = o.cost / o.own;
        const tp = o.p >= avg * (1 + a.sellAbove / 100);
        const sl = a.stop > 0 && o.p <= avg * (1 - a.stop / 100);
        if (tp || sl) {
          const r = sell(c.tk, o.own, true);
          if (r) algoLog(c.tk, tp ? 'TAKE' : 'STOP', r.q, r.avg, r.pnl);
          continue;
        }
      } else {
        if (isHidden(c.tk)) continue;            // never opens new positions in hidden stocks
        const h = o.h, n = Math.min(MA_N, h.length);
        if (n < 10) continue;
        let ma = 0;
        for (let i = h.length - n; i < h.length; i++) ma += h[i];
        ma /= n;
        if (o.p <= ma * (1 - a.buyBelow / 100)) {
          const budget = Game.S.res.coins * a.budget / 100;
          // keep each order to a small slice of the float
          const q = Math.min(maxBuy(o, budget), Math.floor(o.fl * ALGO_MAX_X / IMPACT));
          if (q >= 1) {
            const r = buy(c.tk, q, true);
            if (r) algoLog(c.tk, 'BUY', r.q, r.avg, null);
          }
        }
      }
    }
  }
  // Trend Module strategy: follows the Analyst's call (right ~4 times in 5).
  // Buys a stock while it reads Bullish/Mooning, holds through Calm/Choppy, sells when it turns Bearish/Crashing.
  function runTrend() {
    const s = st(), a = s.algo;
    for (const c of CO) {
      const o = s.co[c.tk];
      if (o.acq) continue;
      const bull = !!BULLISH[o.hm], bear = !!BEARISH[o.hm];
      if (!bull) o.tl = 0;                       // a new bullish run may be traded again
      if (o.own > 0) {
        const avg = o.cost / o.own;
        const sl = a.stop > 0 && o.p <= avg * (1 - a.stop / 100);
        if (bear || sl) {
          const r = sell(c.tk, o.own, true);
          if (r) algoLog(c.tk, bear ? 'EXIT' : 'STOP', r.q, r.avg, r.pnl);
          if (sl && bull) o.tl = 1;              // stopped out mid-run: wait for the next bullish call
        }
      } else if (bull && !o.tl && !isHidden(c.tk)) {
        const budget = Game.S.res.coins * a.budget / 100;
        const q = Math.min(maxBuy(o, budget), Math.floor(o.fl * ALGO_MAX_X / IMPACT));
        if (q >= 1) {
          const r = buy(c.tk, q, true);
          if (r) { algoLog(c.tk, 'RIDE', r.q, r.avg, null); o.tl = 1; }
        }
      }
    }
  }
  function algoLog(tk, side, q, px, pnl) {
    const s = st();
    s.algoLog.unshift({ n: s.n, tk, side, q, px: rp(px), pnl: pnl === null ? null : Math.round(pnl * 100) / 100 });
    if (s.algoLog.length > 8) s.algoLog.length = 8;
  }

  // ---------- portfolio ----------
  function portfolioValue() {
    const s = Game.S && Game.S.stocks;
    if (!s || !s.co) return 0;
    let v = 0;
    for (const c of CO) { const o = s.co[c.tk]; if (o && !o.acq) v += o.own * o.p; }
    return v;
  }
  function unrealized() {
    const s = st();
    let v = 0;
    for (const c of CO) { const o = s.co[c.tk]; if (o && !o.acq && o.own > 0) v += o.own * o.p - o.cost; }
    return v;
  }

  function hexA(color, a) {
    color = (color || '').trim();
    if (color[0] === '#') {
      let h = color.slice(1);
      if (h.length === 3) h = h.split('').map((x) => x + x).join('');
      const n = parseInt(h.slice(0, 6), 16);
      return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
    }
    const m = color.match(/rgba?\(([^)]+)\)/);
    if (m) { const p = m[1].split(',').map((x) => x.trim()); return `rgba(${p[0]},${p[1]},${p[2]},${a})`; }
    return color;
  }
