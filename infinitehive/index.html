    if (hb) { e.stopPropagation(); setHidden(hb.dataset.hide, true); return; }
    const ub2 = e.target.closest('[data-unhide]');
    if (ub2) {
      if (ub2.dataset.unhide === '*') { s.hide = {}; ensureSel(); ui.forceAll = true; Game.sfx('click'); }
      else setHidden(ub2.dataset.unhide, false);
      return;
    }
    const row = e.target.closest('.stk-wrow, .stk-tile');
    if (row && row.dataset.tk) {
      const tk = row.dataset.tk;
      if (s.co[tk] && !s.co[tk].acq) { s.sel = tk; ui.forceAll = true; Game.sfx('click'); }
      return;
    }
    const chip = e.target.closest('[data-q]');
    if (chip) {
      s.qty = chip.dataset.q === 'max' ? 'max' : Number(chip.dataset.q);
      ui.qtyIn.value = s.qty === 'max' ? '' : s.qty;
      Game.sfx('tick');
      return;
    }
    const ub = e.target.closest('button[data-u]');
    if (ub) { buyUpgrade(ub.dataset.u); return; }
    if (e.target.closest('.stk-buy')) { doBuy(e); return; }
    if (e.target.closest('.stk-sell')) { doSell(e); return; }
    if (e.target.closest('.stk-takeover')) { takeover(s.sel); return; }
    if (e.target.closest('.stk-algo-tog')) {
      s.algo.on = !s.algo.on;
      Game.sfx(s.algo.on ? 'upgrade' : 'click');
      Game.toast(`Algo-Trader ${s.algo.on ? 'engaged' : 'paused'}`, 'info', '🤖');
      return;
    }
    const sb = e.target.closest('[data-strat]');
    if (sb && s.upg.trend && s.algo.strat !== sb.dataset.strat) {
      s.algo.strat = sb.dataset.strat;
      for (const c of CO) if (s.co[c.tk]) s.co[c.tk].tl = 0;
      Game.sfx('click');
      Game.toast(s.algo.strat === 'trend' ? 'Algo-Trader now rides trends' : 'Algo-Trader now buys dips', 'info', s.algo.strat === 'trend' ? '📶' : '📉');
    }
  }

  function onInput(e) {
    const s = st();
    const t = e.target;
    if (t === ui.qtyIn) {
      const v = Math.floor(Number(t.value));
      if (v >= 1) s.qty = v;
      return;
    }
    if (t.dataset && t.dataset.a && t.type === 'range') {
      s.algo[t.dataset.a] = Number(t.value);
    }
  }

  function qtyFor(side) {
    const s = st(), o = s.co[s.sel];
    if (!o || o.acq) return 0;
    if (s.qty === 'max') return side === 'buy' ? maxBuy(o, Game.S.res.coins) : Math.floor(o.own);
    const q = Math.max(1, Math.floor(Number(s.qty) || 1));
    return side === 'buy' ? Math.max(0, Math.min(q, Math.floor(o.fl - o.own))) : Math.min(q, Math.floor(o.own));
  }

  function btnPoint(e) {
    const r = e.target.closest('button').getBoundingClientRect();
    return [r.left + r.width / 2, r.top];
  }

  function doBuy(e) {
    const s = st(), tk = s.sel;
    const q = qtyFor('buy');
    const r = q >= 1 ? buy(tk, q, false) : null;
    if (!r) { Game.sfx('error'); return; }
    Game.sfx('buy');
    const [x, y] = btnPoint(e);
    Game.float(x, y, `+${U.fmtInt(r.q)} ${tk}`, colors().good);
    ui.forceAll = true;
  }

  function doSell(e) {
    const s = st(), tk = s.sel;
    const q = qtyFor('sell');
    const r = q >= 1 ? sell(tk, q, false) : null;
    if (!r) { Game.sfx('error'); return; }
    Game.sfx(r.pnl >= 0 ? 'coin' : 'sell');
    const [x, y] = btnPoint(e);
    Game.float(x, y, signed(r.pnl), r.pnl >= 0 ? colors().good : colors().bad);
    if (r.pnl > 0 && r.pnl >= Math.max(1000, Game.S.res.coins * 0.25)) Game.burst(x, y, { n: 18, emoji: '🪙' });
    ui.forceAll = true;
  }

  function buyUpgrade(id) {
    const s = st(), u = UPG.find((x) => x.id === id);
    if (!u || s.upg[id]) return;
    const missing = (u.needs || []).filter((x) => !s.upg[x]);
    if (missing.length) { Game.sfx('error'); Game.toast(`Needs the ${UPG.find((x) => x.id === missing[0]).name} first`, 'bad', u.icon); return; }
    if (!Game.spend({ coins: u.cost })) { Game.sfx('error'); return; }
    s.upg[id] = true;
    Game.sfx('upgrade');
    Game.toast(`${u.name} joins your trading desk`, 'good', u.icon);
    Game.log(`📈 Trading desk upgrade: <b>${u.name}</b>.`, 'info');
    if (id === 'algo') s.algo.on = true;
    if (id === 'trend') { s.algo.strat = 'trend'; s.algo.on = true; Game.log('📶 The Algo-Trader can now <b>ride trends</b>: it buys while the Analyst calls a stock Bullish and sells when it turns Bearish. Switch strategies on the Trading Desk.', 'info'); }
    ui.forceAll = true;
  }

    const s = st();

    ui.qty.innerHTML = '';
    for (const p of presets) ui.qty.appendChild(U.el('button', { class: 'btn sm stk-qchip', type: 'button', 'data-q': String(p), text: U.fmt(p, 0) }));
    ui.qty.appendChild(U.el('button', { class: 'btn sm stk-qchip', type: 'button', 'data-q': 'max', text: 'Max' }));

  function syncInputs() {
    const s = st();
    for (const k in ui.algoIns) ui.algoIns[k].value = s.algo[k];
    ui.qtyIn.value = s.qty === 'max' ? '' : s.qty;
  }

  // ---------- sparkline ----------
  function drawSpark(r, o) {
    const cv = r.spark, ctx = r.sctx;
    const W = cv.width, H = cv.height;
    if (W < 4 || H < 4) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const h = o.h, n = Math.min(h.length, 80);
    if (n < 2) return;
    const start = h.length - n;
    let lo = Infinity, hi = -Infinity;
    for (let i = start; i < h.length; i++) { if (h[i] < lo) lo = h[i]; if (h[i] > hi) hi = h[i]; }
    const span = hi - lo || 1;
    const col = h[h.length - 1] >= h[start] ? colors().good : colors().bad;
    const pad = 2 * ui.dpr;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * W;
      const y = pad + (1 - (h[start + i] - lo) / span) * (H - pad * 2);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5 * ui.dpr;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    ctx.fillStyle = hexA(col, 0.14);
    ctx.fill();
  }

  // ---------- main chart ----------
  function drawChart(dt) {
    const s = st();
    const ctx = ui.ctx, W = ui.cw, H = ui.ch;
    if (!ctx || W < 20 || H < 20) return;
    const dpr = ui.dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const o = s.co[s.sel];
    const none = !o || o.acq || isHidden(s.sel);
    ui.chartEmpty.hidden = !none;
    if (none) return;
    const h = o.h, n = h.length;
    if (n < 2) return;
    const col = colors();
    const reduce = isReduce();
    const L = 8, R = 66, T = 16, B = 22;
    const pw = W - L - R, ph = H - T - B;

    if (ui.lastSel !== s.sel) { ui.lastSel = s.sel; ui.lastN = s.n; ui.anim = 1; ui.view.init = false; }
    else if (ui.lastN !== s.n) { ui.lastN = s.n; ui.anim = reduce ? 1 : 0; }
    ui.anim = Math.min(1, ui.anim + dt / 0.45);
    const e = 1 - Math.pow(1 - ui.anim, 3);

    // y range (eased)
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < n; i++) { const v = h[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
    const avg = o.own > 0 ? o.cost / o.own : 0;
    if (avg > 0 && avg > lo * 0.5 && avg < hi * 1.6) { lo = Math.min(lo, avg); hi = Math.max(hi, avg); }
    const pad = (hi - lo) * 0.12 || hi * 0.05 || 1;
    lo = Math.max(0, lo - pad); hi += pad;
    const v = ui.view;
    if (!v.init || reduce) { v.min = lo; v.max = hi; v.init = true; }
    else { const k = 1 - Math.exp(-dt * 6); v.min += (lo - v.min) * k; v.max += (hi - v.max) * k; }
    const span = (v.max - v.min) || 1;
    const yOf = (p) => T + (1 - (p - v.min) / span) * ph;
    const xOf = (i) => L + (i / (n - 1)) * pw;

    // grid
    ctx.font = `11px ${col.mono}`;
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 1;
    for (let k = 0; k <= 4; k++) {
      const y = T + (k / 4) * ph;
      ctx.strokeStyle = hexA(col.line, 0.9);
      ctx.setLineDash(k === 4 ? [] : [2, 4]);
      ctx.beginPath(); ctx.moveTo(L, Math.round(y) + 0.5); ctx.lineTo(L + pw, Math.round(y) + 0.5); ctx.stroke();
      ctx.fillStyle = col.dim;
      ctx.textAlign = 'left';
      ctx.fillText(fmtPrice(v.max - (k / 4) * span), L + pw + 8, y);
    }
    ctx.setLineDash([]);
    // time labels
    const spanSec = (n - 1) * TICK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = col.dim;
    ctx.fillText('−' + U.fmtDur(spanSec), L + 26, H - 6);
    ctx.fillText('−' + U.fmtDur(spanSec / 2), L + pw / 2, H - 6);
    ctx.fillText('now', L + pw - 12, H - 6);

    // line path
    const up = h[n - 1] >= h[0];
    const lineCol = up ? col.good : col.bad;
    const lastX = U.lerp(xOf(n - 2), xOf(n - 1), e);
    const lastY = U.lerp(yOf(h[n - 2]), yOf(h[n - 1]), e);
    ctx.beginPath();
    for (let i = 0; i < n - 1; i++) {
      const x = xOf(i), y = yOf(h[i]);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineTo(lastX, lastY);
    // area
    ctx.save();
    ctx.lineTo(lastX, T + ph); ctx.lineTo(xOf(0), T + ph); ctx.closePath();
    const grad = ctx.createLinearGradient(0, T, 0, T + ph);
    grad.addColorStop(0, hexA(lineCol, 0.32));
    grad.addColorStop(1, hexA(lineCol, 0));
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
    ctx.beginPath();
    for (let i = 0; i < n - 1; i++) {
      const x = xOf(i), y = yOf(h[i]);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineTo(lastX, lastY);
    ctx.strokeStyle = lineCol;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.shadowColor = hexA(lineCol, 0.6);
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // event markers
    for (const ev of o.ev) {
      const idx = n - 1 - (s.n - ev.n);
      if (idx < 0 || idx >= n) continue;
      const x = xOf(idx), y = yOf(h[idx]);
      ctx.fillStyle = ev.up ? col.good : col.bad;
      ctx.beginPath();
      if (ev.up) { ctx.moveTo(x, y + 8); ctx.lineTo(x - 5, y + 16); ctx.lineTo(x + 5, y + 16); }
      else { ctx.moveTo(x, y - 8); ctx.lineTo(x - 5, y - 16); ctx.lineTo(x + 5, y - 16); }
      ctx.closePath(); ctx.fill();
    }

    // avg cost line
    if (avg > 0 && avg >= v.min && avg <= v.max) {
      const y = Math.round(yOf(avg)) + 0.5;
      ctx.strokeStyle = col.accent;
      ctx.setLineDash([6, 4]);
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = col.accent;
      ctx.font = `bold 10px ${col.mono}`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText('AVG ' + fmtPrice(avg), L + 4, y - 3);
    }

    // pulsing head dot + price pill
    ui.t += dt;
    const pulse = reduce ? 0 : (Math.sin(ui.t * 5) + 1) / 2;
    ctx.fillStyle = hexA(lineCol, 0.25);
    ctx.beginPath(); ctx.arc(lastX, lastY, 5 + pulse * 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = lineCol;
    ctx.beginPath(); ctx.arc(lastX, lastY, 3.5, 0, Math.PI * 2); ctx.fill();
    const label = fmtPrice(o.p);
    ctx.font = `bold 11px ${col.mono}`;
    const tw = ctx.measureText(label).width;
    const py = U.clamp(lastY, T + 8, T + ph - 8);
    const px0 = L + pw + 4;
    ctx.fillStyle = lineCol;
    roundRect(ctx, px0, py - 9, Math.max(tw + 10, R - 8), 18, 5);
    ctx.fill();
    ctx.fillStyle = col.ink;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, px0 + 5, py + 0.5);

    // hover crosshair
    if (ui.hover && ui.hover.x >= L && ui.hover.x <= L + pw) {
      const i = U.clamp(Math.round((ui.hover.x - L) / pw * (n - 1)), 0, n - 1);
      const x = xOf(i), y = yOf(h[i]);
      ctx.strokeStyle = hexA(col.text, 0.35);
      ctx.setLineDash([3, 3]);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, T); ctx.lineTo(Math.round(x) + 0.5, T + ph); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(L, Math.round(y) + 0.5); ctx.lineTo(L + pw, Math.round(y) + 0.5); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = col.text;
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      const ago = (n - 1 - i) * TICK;
      const diff = h[i] / h[0] - 1;
      ui.tip.hidden = false;
      setHTML(ui.tip, `<b>${fmtPrice(h[i])}</b><span class="${diff >= 0 ? 'good' : 'bad'}">${pct(diff)}</span><i>${ago <= 0 ? 'now' : U.fmtDur(ago) + ' ago'}</i>`);
      const tx = U.clamp(x, 70, W - 70);
      ui.tip.style.left = tx + 'px';
      ui.tip.style.top = Math.max(4, y - 52) + 'px';
    } else if (!ui.tip.hidden) ui.tip.hidden = true;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function flash(el, upDir) {
    if (isReduce() || !el) return;
    el.classList.remove('stk-fl-up', 'stk-fl-down');
    void el.offsetWidth;
    el.classList.add(upDir ? 'stk-fl-up' : 'stk-fl-down');
  }

  // ---------- DOM render ----------
  function renderAll() {
    const S = Game.S, s = S.stocks;
    ensureSel();
    const force = ui.forceAll;
    ui.forceAll = false;
    const ticked = ui.rowN !== s.n;

    if (ui.chipsGlobal !== !!s.global) buildQtyChips();

    // header
    const pv = portfolioValue(), unr = unrealized();
    setText(ui.hs.cash, coin(S.res.coins));
    setText(ui.hs.port, coin(pv));
    setText(ui.hs.unr, signed(unr));
    setCls(ui.hs.unr, 'good', unr > 0); setCls(ui.hs.unr, 'bad', unr < 0);
    setText(ui.hs.real, signed(s.realized));
    setCls(ui.hs.real, 'good', s.realized > 0); setCls(ui.hs.real, 'bad', s.realized < 0);
    setText(ui.hs.divs, coin(s.divs));
    setText(ui.glob, s.global ? ' · 🌍 GLOBAL LISTING' : ' · LOCAL MEADOW BOARD');
    ui.tickfill.style.width = U.clamp(s.acc / TICK * 100, 0, 100) + '%';

    // tape
    if (ui.tapeN !== s.n || force) {
      ui.tapeN = s.n;
      const parts = shown().map((c) => {
        const o = s.co[c.tk], h = o.h, ch = h.length > 24 ? h[h.length - 1] / h[h.length - 25] - 1 : 0;
        return `<span class="stk-tp"><b>${c.tk}</b> ${fmtPrice(o.p)} <span class="${ch >= 0 ? 'good' : 'bad'}">${ch >= 0 ? '▲' : '▼'}${Math.abs(ch * 100).toFixed(1)}%</span></span>`;
      }).join('');
      const acq = CO.filter((c) => s.co[c.tk].acq).map((c) => `<span class="stk-tp"><b>${c.tk}</b> <span class="royal">HIVE-OWNED</span></span>`).join('');
      const seg = parts + acq || '<span class="stk-tp">No listings</span>';
      ui.tape.innerHTML = seg + seg;
    }

    // insider
    const nx = s.next;
    const showIns = s.upg.insider && nx && nx.in <= INSIDER_TICKS;
    if (showIns) {
      const secs = Math.max(1, Math.ceil((nx.in - 1) * TICK + (TICK - s.acc)));
      const who = nx.tk === '*' ? 'the <b>whole market</b>' : `<b>${nx.tk}</b>`;
      setHTML(ui.insider, `<span class="stk-ins-ico">📡</span><span>Rumor on the wire: ${nx.mega ? 'HUGE ' : 'big '}<b class="${nx.up ? 'good' : 'bad'}">${nx.up ? 'GOOD' : 'BAD'}</b> news about ${who} in ~${secs}s</span>`);
      ui.insider.classList.toggle('up', !!nx.up);
    }
    ui.insider.hidden = !showIns;

    // watchlist
    const l = shown();
    ui.wlEmpty.hidden = l.length > 0;
    ui.groups.co.hidden = !l.some((c) => !c.trade);
    ui.groups.tr.hidden = !l.some((c) => c.trade);
    const hid = listed().filter((c) => isHidden(c.tk));
    const hsig = hid.map((c) => c.tk).join(',');
    if (ui.hiddenSig !== hsig) {
      ui.hiddenSig = hsig;
      ui.hiddenBox.hidden = !hid.length;
      ui.hiddenBox.innerHTML = '';
      if (hid.length) {
        ui.hiddenBox.append(
          U.el('span', { class: 'muted', text: `👁 Hidden (${hid.length}):` }),
          ...hid.map((c) => U.el('button', { class: 'btn sm stk-unhide', type: 'button', 'data-unhide': c.tk, title: `Show ${c.name} again` }, `${c.icon} ${c.tk}`)));
        if (hid.length > 1) ui.hiddenBox.append(U.el('button', { class: 'btn sm ghost stk-unhide', type: 'button', 'data-unhide': '*' }, 'Show all'));
      }
    }
    for (const c of CO) {
      const r = ui.rows[c.tk], o = s.co[c.tk];
      const gone = o.acq || isHidden(c.tk);
      if (r.row.hidden !== gone) r.row.hidden = gone;
      if (gone) continue;
      r.row.classList.toggle('sel', s.sel === c.tk);
      r.row.classList.toggle('held', o.own > 0);
      setText(r.price, fmtPrice(o.p));
      const ch = o.h[o.h.length - 1] / o.h[0] - 1;
      setText(r.chg, pct(ch));
      setCls(r.chg, 'good', ch >= 0); setCls(r.chg, 'bad', ch < 0);
      if (r.lastN !== s.n || force) {
        if (ticked && r.lastN >= 0 && o.h.length > 1) flash(r.price, o.h[o.h.length - 1] >= o.h[o.h.length - 2]);
        r.lastN = s.n;
        drawSpark(r, o);
      }
    }
    ui.rowN = s.n;

    // selected header
    const c = BY[s.sel], o = s.co[s.sel];
    if (c && o && !o.acq && !isHidden(s.sel)) {
      if (ui.tradeChip.hidden !== !c.trade) ui.tradeChip.hidden = !c.trade;
      if (ui.stake.hidden !== !!c.trade) ui.stake.hidden = !!c.trade;
      setText(ui.symIco, c.icon);
      setText(ui.symTk, c.tk);
      setText(ui.symName, c.name);
      setText(ui.px, '🪙' + fmtPrice(o.p));
      const ch = o.h[o.h.length - 1] / o.h[0] - 1;
      setText(ui.chg, `${pct(ch, 2)} over ${U.fmtDur((o.h.length - 1) * TICK)}`);
      setCls(ui.chg, 'good', ch >= 0); setCls(ui.chg, 'bad', ch < 0);
      if (s.upg.analyst) {
        const M = MODES[o.hm];
        setHTML(ui.mode, `🐝 Analyst: <b class="${M.cls}">${M.label} ${M.arrow}</b>`);
      } else setHTML(ui.mode, '🐝 Mood: <span class="dim">hire an Analyst Bee</span>');
      setText(ui.yield, c.div ? `🧾 Dividend ${(c.div * 100).toFixed(2)}%/min` : '🧾 No dividend');
      setText(ui.mcap, `Mkt cap ${coin(o.p * o.fl)}`);

      // trade box
      const qb = qtyFor('buy'), qs = qtyFor('sell');
      const bq = qb >= 1 ? buyQuote(o, qb) : null;
      const sq = qs >= 1 ? sellQuote(o, qs) : null;
      const isMax = s.qty === 'max';
      setText(ui.buyBtn, qb >= 1 ? `Buy ${U.fmtInt(qb)}` : (isMax ? 'Buy Max' : 'Buy'));
      setText(ui.sellBtn, qs >= 1 ? (isMax ? `Sell all ${U.fmtInt(qs)}` : `Sell ${U.fmtInt(qs)}`) : 'Sell');
      ui.buyBtn.disabled = !bq || bq.total > S.res.coins;
      ui.sellBtn.disabled = !sq;
      let qhtml = '';
      if (bq) {
        const imp = bq.avg / o.p - 1;
        qhtml += `<span>Buy ≈ <b class="${bq.total > S.res.coins ? 'bad' : ''}">${coin(bq.total)}</b>${imp >= 0.001 ? ` <i>(+${(imp * 100).toFixed(1)}% impact)</i>` : ''}</span>`;
      } else if (o.own >= o.fl - 0.5) qhtml += '<span class="dim">You own every share.</span>';
      else qhtml += '<span class="dim">Not enough coins for a share.</span>';
      if (sq) {
        const basis = o.cost * (qs / o.own), pnl = sq.net - basis;
        qhtml += `<span>Sell ≈ <b>${coin(sq.net)}</b> <i class="${pnl >= 0 ? 'good' : 'bad'}">${signed(pnl)}</i></span>`;

      if (isMax && document.activeElement !== ui.qtyIn && ui.qtyIn.value !== '') ui.qtyIn.value = '';

      setText(ui.pos.own, U.fmtInt(o.own));
      const avg = o.own > 0 ? o.cost / o.own : 0;
      setText(ui.pos.avg, o.own > 0 ? fmtPrice(avg) : '—');
      setText(ui.pos.val, coin(o.own * o.p));
      const pnl = o.own * o.p - o.cost;
      setText(ui.pos.pnl, o.own > 0 ? `${signed(pnl)} (${pct(o.p / avg - 1)})` : '—');
      setCls(ui.pos.pnl, 'good', o.own > 0 && pnl >= 0); setCls(ui.pos.pnl, 'bad', o.own > 0 && pnl < 0);
      if (!c.trade) {
        const stake = o.own / o.fl;
        setText(ui.pos.stake, stake > 0 && stake < 0.01 ? (stake * 100).toFixed(3) + '%' : (stake * 100).toFixed(1) + '%');

        ui.stakeFill.classList.toggle('ready', stake >= TAKE_PCT);
        setHTML(ui.perk, `🏢 Takeover perk: <b>${c.perk}</b>`);
      }
      const can = canTakeover(o);
      ui.takeBtn.hidden = !can;
      if (can) {

        ui.takeBtn.disabled = fee > S.res.coins;
      }
    }

    for (const u of UPG) {

        ? 'Ride trends: buys a stock you don\'t hold while the Analyst calls it Bullish or Mooning, holds through Calm and Choppy, and sells everything when the call turns Bearish or Crashing. Manages your own positions too. The Analyst is right about 4 times in 5.'
        : 'Manages every open position (yours too). Only buys stocks you don\'t hold.');
      setText(ui.algoVals.buyBelow, s.algo.buyBelow + '%');
      setText(ui.algoVals.sellAbove, '+' + s.algo.sellAbove + '%');

  function takeoverCostOf(o) {
    if (!o || o.acq) return 0;
    const need = Math.max(0, Math.ceil(o.fl * TAKE_PCT - o.own));
    const bq = need > 0 ? buyQuote(o, need) : { total: 0, after: o.p };
    return bq.total + Math.max(0, o.fl - o.own - need) * bq.after * TAKE_PREMIUM;
  }

    },

    onLoad() {

      ui.view.init = false;
      ui.lastSel = null;
      ui.forceAll = true;
      for (const tk in ui.rows) ui.rows[tk].lastN = -1;
      if (ui.resize) requestAnimationFrame(ui.resize);
    },
    tick(dt) {
      const S = Game.S;
      if (!S || !S.stocks) return;
      ensure();
      const s = S.stocks;
      if (S.phase >= 2 && !s.global) goGlobal(dt > 0.5);
      if (!S.tabs || !S.tabs.exchange) return;
      const quiet = dt > 0.5;
      s.acc += dt;
      let guard = 0;
      while (s.acc >= TICK && guard++ < 8) { s.acc -= TICK; marketTick(quiet); }
      if (s.acc >= TICK) s.acc = 0;
      s.divAcc += dt;
      if (s.divAcc >= DIV_EVERY) { s.divAcc -= DIV_EVERY; payDividends(); }
    },
    render() {
      if (!ui.built || Game.activeTab !== 'exchange' || !Game.S || !Game.S.stocks || !Game.S.stocks.co) return;
      if (!ui.wasActive) { ui.wasActive = true; ui.forceAll = true; if (ui.resize) ui.resize(); }
      renderAll();
    },
    frame(dtReal) {
      if (!ui.built || Game.activeTab !== 'exchange') { ui.wasActive = false; return; }
      if (!Game.S || !Game.S.stocks || !Game.S.stocks.co) return;
      if (ui.cw === 0 && ui.resize) ui.resize();
      drawChart(Math.min(0.1, dtReal || 0.016));
    },
    mult(key) {
      const s = Game.S && Game.S.stocks;
      if (!s || !s.co) return 1;
      let m = 1;
      for (const c of CO) {
        const o = s.co[c.tk];
        if (o && o.acq && c.perkMult && c.perkMult[key]) m *= c.perkMult[key];
      }
      return m;
    },
    onPhase(n) {
      if (n >= 2 && Game.S && Game.S.stocks && !Game.S.stocks.global) goGlobal(false);
      if (n === 3 && Game.S.tabs && Game.S.tabs.exchange && typeof Game.news === 'function') {
        Game.news('📈 Earth markets keep trading while the Hive sails for the stars. Ping to orbit: 1.3 s. Ping to Alpha Centauri: 4.2 years.');
      }
    },
  });

  // ---------- public API ----------
  Game.stocks = {

    companies: () => CO.map((c) => ({ tk: c.tk, name: c.name, perk: c.perk || null, tradeOnly: !!c.trade })),

    buy(tk, q) { return buy(tk, q, false); },
    sell(tk, q) { return sell(tk, q, false); },
    maxBuy(tk) { const o = Game.S.stocks.co[tk]; return o ? maxBuy(o, Game.S.res.coins) : 0; },
    takeover,
    takeoverCost(tk) { return takeoverCostOf(Game.S.stocks.co[tk]); },
  };
})();

  /** Enemy force for an engagement spec. power = sqrt(totalHP × totalDPS) */

    return Math.max(1, Math.ceil(T.REC_RATIO * comp.power / (perBodyPower(sp.tactic) * T.AUTO_EFF * formMul(sp.tactic, form || curForm()))));
  }
  /** greedy "recommended" strike force: the counter specialist first, then drones, then the rest */
  function recommendMix(sp, form) {
    const av = availableByType();
    const need = T.REC_RATIO * composition(sp).power / (T.AUTO_EFF * formMul(sp.tactic, form || curForm()));
    const c = UNIT_COUNTER[sp.tactic] || {};
    const order = [];
    for (const t of [c.good, 'drone', 'scout', 'brute', 'sniper', c.bad]) if (t && order.indexOf(t) < 0 && t !== c.bad) order.push(t);
    if (c.bad) order.push(c.bad);
    const ps = droneStats();
    let Hs = 0, Ds = 0;
    const out = emptyMix();
    for (const t of order) {
      const left = av[t] || 0;
      if (left <= 0) continue;
      const hd = bodyHD(t, ps, sp.tactic);
      const a = hd[0] * hd[1], b = Hs * hd[1] + Ds * hd[0], cc = Hs * Ds - need * need;
      let n = cc >= 0 ? 0 : Math.ceil((-b + Math.sqrt(b * b - 4 * a * cc)) / (2 * a));
      n = Math.min(left, Math.max(0, n));
      out[t] += n; Hs += n * hd[0]; Ds += n * hd[1];
      if (Hs * Ds >= need * need) break;
    }
    return out;
  }

  /* ---------- deployment points & per-fight caps ---------- */
  const PTS = (t) => T.POINTS[t] || 1;
  function mixPoints(mix) { let p = 0; if (mix) for (const t of UTYPES) p += (mix[t] || 0) * PTS(t); return p; }
  /** a "par" drone for a tier: the minimum fleet upgrades a steady player has by then. Caps are measured against
      max(par, your fleet): a fleet behind par gets worse odds, and one ahead of it (upgrades, edicts) gets no free
      ride, so the labels stay true however far you upgrade. (A par that expected every upgrade maxed by Sector VIII
      was a wall: the balance bot lost 33 fights in a row at Sector VII.) */
  function refPower(tier) {
    const L = Math.max(0, normTier(tier) - 1), h = Math.floor(L / 2);
    return perDronePower({ hp: T.DRONE.hp * Math.pow(T.HULL_MULT, L), dmg: T.DRONE.dmg * Math.pow(T.STING_MULT, L), rate: T.DRONE.rate * (1 + T.THRUST_RATE * h), shield: h, thrust: h, tactics: h });
  }
  /** cap as a multiple of the enemy's strength: generous early, about even at the end, risky vs the Empress */
  function capRatio(sp) {
    if (sp.arena) return sp.arenaCap;
    if (sp.tier >= 9 || sp.kind === 'boss') {
      if (sp.empress) return T.CAP_EMPRESS;
      return T.CAP_GUARD[U.clamp((sp.round || 1) - 1, 0, T.CAP_GUARD.length - 1)];
    }
    const sc = T.SECTOR_CAPS[U.clamp(Math.round(sp.tier) || 1, 1, 8)];
    const x = sp.rounds > 1 ? U.clamp(((sp.round || 1) - 1) / (sp.rounds - 1), 0, 1) : 0;
    return sc[0] + (sc[1] - sc[0]) * x;
  }
  /** the most deployment points you may bring to this fight */
  function capPoints(sp) {
    // Every fight is measured against your actual fleet (or par, whichever is stronger), so its difficulty label
    // is true for everyone: extra upgrades / edicts don't turn "Risky" into "Overwhelming". Formation, counter
    // units, abilities and their ranks are what beat the label.
    let ref = sp.arenaRef || refPower(sp.tier);
    if (Game.S && Game.S.combat) ref = Math.max(ref, perDronePower());
    return Math.max(T.CAP_MIN, Math.ceil(capRatio(sp) * composition(sp).power / ref));
  }
  /** shrink a mix proportionally until it fits the point cap, then top up with whatever still fits */
  function fitToCap(mix, cap) {
    const m = Object.assign(emptyMix(), mix);
    const pts = mixPoints(m);
    if (pts <= cap) return m;
    const f = cap / pts, out = emptyMix();
    for (const t of UTYPES) out[t] = Math.floor((m[t] || 0) * f);
    let left = cap - mixPoints(out);
    for (const t of ['brute', 'sniper', 'scout', 'drone']) while (left >= PTS(t) && out[t] < (m[t] || 0)) { out[t]++; left -= PTS(t); }
    return out;
  }

  /** Lanchester square-law prediction (eff = 1 → manual, passive play). `sent` = body count or a type mix */
  function predict(sp, sent, eff, form) {
    const comp = composition(sp);
    form = form || curForm();
    const mix = sent && typeof sent === 'object' ? sent : propMix(sent);
    sent = mixTotal(mix);
    const Pp = mixPower(mix, sp.tactic) * (eff === undefined ? autoEff(sp) : eff) * formMul(sp.tactic, form);
    const Pe = comp.power;
    if (sent <= 0 || Pp <= 0) return { won: false, lossFrac: 1, killFrac: 0, comp, Pp, Pe, ratio: 0 };
    const r = Pe / Pp;
    if (r < 1) return { won: true, lossFrac: 1 - Math.sqrt(1 - r * r), killFrac: 1, comp, Pp, Pe, ratio: 1 / r };
    return { won: false, lossFrac: 1, killFrac: 1 - Math.sqrt(Math.max(0, 1 - 1 / (r * r))), comp, Pp, Pe, ratio: 1 / r };
  }

  function droneCost(n, own) {
    if (own === undefined) own = priceBase();
    return T.DRONE_BASE_COST * gm('droneCost') * (n + (n * own + n * (n - 1) / 2) / T.DRONE_COST_SCALE);
  }
  function maxDrones(budget, own) {
    if (own === undefined) own = priceBase();
    const unit = T.DRONE_BASE_COST * gm('droneCost');
    if (!(budget > 0) || unit <= 0) return 0;
    const c = budget / unit, a = 1 / (2 * T.DRONE_COST_SCALE), b = 1 + (own - 0.5) / T.DRONE_COST_SCALE;
    let n = Math.max(0, Math.floor((-b + Math.sqrt(b * b + 4 * a * c)) / (2 * a)));
    while (n > 0 && droneCost(n, own) > budget) n--;
    while (droneCost(n + 1, own) <= budget) n++;
    return n;
  }

  /* ---------- abilities ---------- */
  function abilLevels() { return (Game.S && Game.S.combat && Game.S.combat.abil) || { barrage: 0, shield: 0, teleport: 0, bomb: 0 }; }
  function abilParams(lv, tac) {
    lv = lv || {};
    const R = T.ABIL_RANK;
    const cdMul = Math.max(0.6, 1 - T.TACTICS_CD * (tac || 0));
    const b = lv.barrage | 0, s = lv.shield | 0, tp = lv.teleport | 0, m = lv.bomb | 0;
    return {
      shots: T.BARRAGE_SHOTS + R.barrageShots * b,
      shieldDur: T.SHIELD_DUR + R.shieldDur * s, shieldRed: Math.min(0.85, T.SHIELD_RED + R.shieldRed * s),
      bombR: T.BOMB_R * (1 + R.bombR * m), bombSecs: T.BOMB_SECS * (1 + R.bombDmg * m),
      cd: {
        barrage: T.ABIL_CD.barrage * Math.max(0.5, 1 - R.barrageCd * b) * cdMul,
        shield: T.ABIL_CD.shield * cdMul, teleport: T.ABIL_CD.teleport * Math.max(0.3, 1 - R.tpCd * tp) * cdMul, bomb: T.ABIL_CD.bomb * cdMul,
      },
    };
  }
  function abilityCost(id) { return (T.ABILITY_RJ[id] || 0) * gm('abilityCost'); }
  function abilityUpgCost(id) {
    const L = abilLevels()[id] | 0;
    if (!T.ABIL_UPG_BASE[id] || L >= T.ABIL_MAX) return null;
    return { stardust: T.ABIL_UPG_BASE[id] * Math.pow(T.ABIL_UPG_GROWTH, L), jelly: T.ABIL_UPG_RJ * Math.pow(T.ABIL_UPG_RJ_GROWTH, L) };
  }

  /* ---------- repair rotation ---------- */
  function restingN() { let n = 0; for (const r of C().resting) n += r.n; return n; }
  /** per-type bodies currently in repair (old entries without a breakdown count as drones) */
  function restingByType() {
    const out = emptyMix();
    for (const r of C().resting) {
      if (r.by) for (const t of UTYPES) out[t] += r.by[t] || 0;
      else out.drone += r.n || 0;
    }
    return out;
  }
  function inBattleByType() {
    return cur && !cur.sim && cur.battle && !cur.battle.reported ? (cur.battle.cfg.sentBy || { drone: cur.battle.cfg.sent }) : null;
  }
  /** total bodies per type (standard drones = total − specialists) */
  function unitsTotal() {
    const out = emptyMix();
    if (!Game.S || !Game.S.combat) return out;
    const u = C().units || {};
    let spec = 0;
    for (const t of SPEC_TYPES) { out[t] = Math.max(0, Math.floor(u[t] || 0)); spec += out[t]; }
    out.drone = Math.max(0, owned() - spec);
    return out;
  }
  function availableByType() {
    const tot = unitsTotal();
    if (!Game.S || !Game.S.combat) return tot;
    const rest = restingByType(), bat = inBattleByType();
    for (const t of UTYPES) tot[t] = Math.max(0, tot[t] - rest[t] - (bat ? bat[t] || 0 : 0));
    return tot;
  }
  function available() {
    if (!Game.S || !Game.S.combat) return 0;
    return mixTotal(availableByType());
  }
  /** keep specialist counts and repair entries consistent with the body total */
  function sanitizeUnits() {
    const c = C();
    if (!c.units || typeof c.units !== 'object') c.units = { scout: 0, brute: 0, sniper: 0 };
    const u = c.units;
    let spec = 0;
    for (const t of SPEC_TYPES) { u[t] = Math.max(0, Math.floor(u[t] || 0)); spec += u[t]; }
    let over = spec - owned();
    for (const t of ['scout', 'sniper', 'brute']) { if (over <= 0) break; const d = Math.min(u[t], over); u[t] -= d; over -= d; }
    // repair entries can never exceed the bodies of each type
    const tot = unitsTotal(), rest = restingByType(), rs = c.resting;
    for (const t of UTYPES) {
      let ex = rest[t] - tot[t];
      for (let i = rs.length - 1; i >= 0 && ex > 0; i--) {
        const r = rs[i];
        if (!r.by) r.by = { drone: r.n || 0 };
        const d = Math.min(r.by[t] || 0, ex);
        if (d > 0) { r.by[t] -= d; r.n -= d; ex -= d; }
      }
    }
    for (let i = rs.length - 1; i >= 0; i--) if (!(rs[i].n > 0)) rs.splice(i, 1);
  }
  function restingInfo() {
    if (!Game.S || !Game.S.combat) return { n: 0, nextSecs: 0, nextN: 0, frac: 0 };
    const rs = C().resting;
    if (!rs.length) return { n: 0, nextSecs: 0, nextN: 0, frac: 0 };
    let nx = rs[0];
    for (const r of rs) if (r.until < nx.until) nx = r;
    const left = Math.max(0, nx.until - Game.S.time);
    const tot = nx.total || restSecs();
    return { n: restingN(), nextSecs: left, nextN: nx.n, frac: U.clamp(1 - left / tot, 0, 1) };
  }
  /** send survivors (a per-type mix) to the repair bays */
  function sendToRepair(by) {
    if (!Game.S) return 0;
    const b = emptyMix();
    for (const t of UTYPES) b[t] = Math.max(0, Math.floor((by && by[t]) || 0));
    const n = mixTotal(b);
    if (n <= 0) return 0;
    const secs = restSecs();
    const rs = C().resting;
    rs.push({ n, until: Game.S.time + secs, total: secs, by: b });
    if (rs.length > 40) {
      rs.sort((x, y) => x.until - y.until);
      const a = rs.shift(), z = rs[0];
      if (!z.by) z.by = { drone: z.n };
      const ab = a.by || { drone: a.n };
      for (const t of UTYPES) z.by[t] = (z.by[t] || 0) + (ab[t] || 0);
      z.n += a.n;
    }
    return secs;
  }

  /* ======================= BATTLE SIMULATION (DOM-free) ======================= */
  const W = T.WORLD_W, H = T.WORLD_H;
  const NO_GROUP = [];
  let uidSeq = 1;

  class Battle {
    /** cfg: { comp, sent, sim, ps, abil, fx, gfx, formation, countdown, sfx(name), pay(name)->bool, particles } */
    constructor(cfg) {
      this.cfg = cfg;
      this.comp = cfg.comp;
      this.fx = cfg.fx !== false;
      this.setGfx(cfg.gfx || T.GFX.balanced);
      this.dmgNums = this.fx && !!cfg.dmgNums;
      this.t = 0; this.vt = 0; this.over = false; this.outcome = null; this.endT = 0;
      this.players = []; this.enemies = [];
      this.bolts = []; this.orbs = []; this.parts = []; this.rings = []; this.texts = []; this.zones = []; this.bombs = [];
      this.boltPool = []; this.orbPool = []; this.partPool = [];
      this._c0 = { x: 0, y: 0 }; this._c1 = { x: 0, y: 0 };
      this.rally = null; this.lastClick = null;
      this.abp = abilParams(cfg.abil, cfg.ps.tactics || 0);
      this.ab = {};   // abilities start half-charged (they tick down once the countdown ends)
      for (const k of ABIL_ORDER) this.ab[k] = { cd: this.abp.cd[k] * T.ABIL_START_CD, t: 0 };
      this.tpAim = null;   // where the Teleport cursor is while aiming (drawn as a portal preview)
      this.used = {}; this.kills = 0; this.shake = 0; this.flashT = 0;
      this.countdown = cfg.countdown === undefined ? 2.2 : cfg.countdown;
      this.retreat = 0; this.timeScale = 1; this.banner = null; this.bomb10 = false;
      this.boss = null; this.cmd = null; this.cmdKilled = false; this.eMaxHp = 0;
      this.tele = []; this.teleT = { cmd: T.TELE.CONE_FIRST, cone: T.TELE.CONE_FIRST, nova: T.TELE.NOVA_FIRST }; this.teleHits = 0;
      this.engaged = this.comp.tactic === 'pincer'; this.lastHitT = 0; this.hunting = false;
      this.rcx = 230; this.rcy = H / 2; this.spT = null; this.spTimer = 0;
      this.setFormation(cfg.formation || 'swarm');
      this.spawnPlayers(); this.spawnEnemies();
      this.p0Hp = this.sideHp(0); this.eMaxHp = this.sideHp(1);
    }
    sfx(n) { if (this.cfg.sfx) this.cfg.sfx(n); }
    setGfx(g) { this.gfx = g; this.trailMode = this.fx ? g.trail : 0; }
    setFormation(id) {
      if (!FORM[id]) id = 'swarm';
      this.formation = id;
      const f = FORM[id], m = matchup(this.comp.tactic, id);
      this.match = m.state;
      this.mods = { dmg: f.dmg * m.p, taken: f.taken / m.p, speed: f.speed };
    }

    mkUnit(side, type, k, x, y, st) {
      const u = {
        id: uidSeq++, side, type, k, x, y, vx: 0, vy: 0, angle: side ? Math.PI : 0,
        hp: st.hp, maxHp: st.hp, dmg: st.dmg, rate: st.rate, range: st.range, speed: st.speed, size: st.size,
        regen: st.regen || 0, cd: Math.random() / st.rate, rt: Math.random() * 0.3, target: null, alive: true,
        flash: 0, pending: 0, seed: Math.random() * 100, burst: 0, burstT: 0, jx: 0, jy: 0, hx: x, hy: y,
        parent: null, isBoss: false, aim: null,
      };
      (side ? this.enemies : this.players).push(u);
      return u;
    }

    spawnPlayers() {
      let by = this.cfg.sentBy;
      if (!by || mixTotal(by) <= 0) { by = emptyMix(); by.drone = Math.max(1, Math.floor(this.cfg.sent)); }
      this.sentBy = Object.assign(emptyMix(), by);
      const ps = this.cfg.ps, tac = this.comp.tactic;
      // squad slots per type: proportional, at least one squad per committed type
      const types = SPAWN_ORDER.filter((t) => (by[t] || 0) > 0);
      const total = types.reduce((s, t) => s + by[t], 0);
      const slots = Math.min(T.MAX_UNITS, total);
      const alloc = {};
      let used = 0;
      for (const t of types) { alloc[t] = Math.min(by[t], Math.max(1, Math.floor(slots * by[t] / total))); used += alloc[t]; }
      while (used < slots) {
        let best = null, br = -Infinity;
        for (const t of types) { if (alloc[t] >= by[t]) continue; const r = slots * by[t] / total - alloc[t]; if (r > br) { br = r; best = t; } }
        if (!best) break;
        alloc[best]++; used++;
      }
      while (used > slots) {
        let best = null;
        for (const t of types) if (alloc[t] > 1 && (!best || alloc[t] > alloc[best])) best = t;
        if (!best) break;
        alloc[best]--; used--;
      }
      const cx = 230, cy = H / 2;
      let i = 0;
      for (const t of types) {
        const m = T.UNITS[t], units = alloc[t], n = by[t];
        const base = Math.floor(n / units), extra = n % units;
        const mt = unitMatch(tac, t);
        const xoff = t === 'brute' ? 45 : t === 'sniper' ? -70 : t === 'scout' ? -20 : 0;
        for (let j = 0; j < units; j++, i++) {
          const k = base + (j < extra ? 1 : 0);
          const size = T.DRONE.size * m.size * (1 + 0.2 * Math.log(Math.max(1, k)));
          const a = i * 2.39996, rr = 10.5 * Math.sqrt(i) * (1 + 0.2 * Math.log(Math.max(1, k)));
          const u = this.mkUnit(0, 'drone', k, U.clamp(cx + xoff + Math.cos(a) * rr, 20, W * 0.4), U.clamp(cy + Math.sin(a) * rr * 1.25, 20, H - 20),
            { hp: ps.hp * m.hp * k, dmg: ps.dmg * m.dmg * k, rate: ps.rate * m.rate, range: ps.range * m.range, speed: ps.speed * m.speed, size, regen: ps.regen });
          u.ut = t; u.umD = mt; u.umT = 1 / mt;
          u.jx = U.rand(-55, 55); u.jy = U.rand(-55, 55);
          u.tr = new Float32Array(16); u.trI = 0; u.trN = 0; u.trT = 0; u.tx = u.x; u.ty = u.y;
        }
      }
    }

    spawnEnemy(type, k, x, y) {
      const et = ETYPES[type], g = this.comp.g;
      const size = et.size * (1 + 0.16 * Math.log(Math.max(1, k)));
      const u = this.mkUnit(1, type, k, x, y, { hp: et.hp * g * k, dmg: et.dmg * g * k, rate: et.rate, range: et.range, speed: et.speed, size });
      if (type === 'carrier') { u.spawnCd = U.rand(2, 4); u.spawned = 0; u.kids = 0; }
      return u;
    }
    launchScout(c) {
      const s = this.spawnEnemy('scout', c.k, c.x - c.size - U.rand(0, 30), c.y + U.rand(-30, 30));
      s.parent = c; c.kids++; c.spawned++;
      return s;
    }

    /** where a unit of `type` spawns for the current enemy tactic */
    spawnPos(type, i, nu) {
      const tac = this.comp.tactic;
      const gy = () => U.clamp(H / 2 + U.gauss() * 130, 70, H - 70);
      if (tac === 'pincer') {
        const top = i % 2 === 0;
        return [U.rand(640, 1060), top ? U.rand(60, 190) : U.rand(H - 190, H - 60)];
      }
      if (tac === 'swarm') return [U.rand(1120, 1520), U.rand(60, H - 60)];
      if (tac === 'phalanx') {
        if (type === 'brute') return [1130 + (i % 2) * 34, 90 + (nu > 1 ? i / (nu - 1) : 0.5) * (H - 180)];
        return [U.rand(1240, 1360), gy()];
      }
      if (tac === 'snipers') {
        if (type === 'sniper') return [U.rand(1430, 1545), U.rand(80, H - 80)];
        return [U.rand(1150, 1280), gy()];
      }
      if (tac === 'carriers') {
        if (type === 'carrier') return [U.rand(1440, 1545), 120 + (nu > 1 ? i / (nu - 1) : 0.5) * (H - 240)];
        return [U.rand(1250, 1450), gy()];
      }
      const zones = { scout: [1200, 1400], warrior: [1190, 1370], brute: [1140, 1260], carrier: [1430, 1530], sniper: [1400, 1530] };
      const z = zones[type] || zones.warrior;
      return [U.rand(z[0], z[1]), gy()];
    }

    spawnEnemies() {
      const comp = this.comp;
      const total = comp.list.reduce((s, e) => s + e.count, 0);
      const cap = comp.boss ? T.MAX_ENEMY_UNITS - 15 : comp.cmd ? T.MAX_ENEMY_UNITS - 2 : T.MAX_ENEMY_UNITS;
      const kE = Math.max(1, total / cap);
      this.escortK = kE;
      for (const ent of comp.list) {
        const nu = Math.max(1, Math.round(ent.count / kE));
        const k = ent.count / nu;
        for (let i = 0; i < nu; i++) {
          const p = this.spawnPos(ent.type, i, nu);
          const u = this.spawnEnemy(ent.type, k, p[0], p[1]);
          if (ent.type === 'carrier') for (let j = 0; j < T.CARRIER_START; j++) this.launchScout(u);
        }
      }
      if (comp.cmd) {
        const et = ETYPES.commander;
        const c = this.mkUnit(1, 'commander', 1, comp.tactic === 'pincer' ? 1100 : 1470, H / 2,
          { hp: comp.cmd.hp, dmg: comp.cmd.dps / et.rate, rate: et.rate, range: et.range, speed: et.speed, size: et.size });
        this.cmd = c;
      }
      if (comp.boss) {
        const b = this.mkUnit(1, 'empress', 1, 1380, H / 2, { hp: comp.boss.hp, dmg: 0, rate: 1, range: 600, speed: 70, size: 72 });
        b.isBoss = true; b.phase = 1; b.dps = comp.boss.dps; b.invuln = 0;
        b.tRing = 2.5; b.tAim = 1.2; b.tSpiral = 0; b.spA = 0; b.tLunge = 8; b.lunge = 0; b.tBeam = 6; b.beam = null; b.tSpawn = 5;
        this.boss = b;
      }
    }

    sideHp(side) { let s = 0; for (const u of side ? this.enemies : this.players) if (u.alive) s += u.hp; return s; }
    aliveCount(side) { let n = 0; for (const u of side ? this.enemies : this.players) if (u.alive) n++; return n; }
    dronesLeft() { let s = 0; for (const u of this.players) if (u.alive) s += u.k * u.hp / u.maxHp; return s; }
    enemiesLeft() { let s = 0; for (const u of this.enemies) if (u.alive) s += u.isBoss || u.type === 'commander' ? 1 : u.k; return s; }
    /** centroid into a cached object (do not hold the result across calls) */
    centroid(side) {
      let x = 0, y = 0, n = 0;
      for (const u of side ? this.enemies : this.players) if (u.alive) { x += u.x; y += u.y; n++; }
      if (!n) return null;
      const o = side ? this._c1 : this._c0;
      o.x = x / n; o.y = y / n;
      return o;
    }
    fleetDps() { let d = 0; for (const u of this.players) if (u.alive) d += u.dmg * u.rate * (u.umD || 1); return d * this.mods.dmg; }
    nearest(side, x, y, maxD) {
      let best = null, bd = maxD * maxD;
      for (const u of side ? this.enemies : this.players) {

    detonate(x, y, R) {

    /** warp every living unit to (x, y), keeping the formation's shape but packed within TP_SPREAD; the fleet then holds there */

          this.part(nx, ny, Math.cos(a) * sp * 0.6, Math.sin(a) * sp * 0.6, U.rand(0.3, 0.6), '#7fe6ff', U.rand(2, 4), 2);

    startRetreat() {

    /* ---------- main update (real dt) ---------- */

    /* ---------- players ---------- */

            if (!bt) bt = this.nearest(1, u.x, u.y, u.range * 1.4);

    }
    /** Bombers dive enemy snipers first, else the usual target */

        <div class="card" style="margin:0"><div class="hint">Fastest win</div><div class="big-num">${b.end != null ? U.fmtTime(b.end) : '—'}</div></div>
        <div class="card" style="margin:0"><div class="hint">Best Phase I</div><div class="big-num">${b.p2 != null ? U.fmtTime(b.p2) : '—'}</div></div>
        <div class="card" style="margin:0"><div class="hint">Best Phase II</div><div class="big-num">${b.p3 != null ? U.fmtTime(b.p3) : '—'}</div></div>
      </div>
      ${fastest.length ? `<div class="card-title" style="margin:6px 0">⚡ Fastest completions</div><table class="tbl"><tr><th>#</th><th>Date</th><th>Ending</th><th>Time</th><th>Honey</th><th>Score</th></tr>${fastest.map(row).join('')}</table>` : ''}
      <div class="card-title" style="margin:16px 0 6px">🥇 Top runs by score</div>
      ${list.length ? `<table class="tbl"><tr><th>#</th><th>Date</th><th>Result</th><th>Time</th><th>Honey</th><th>Score</th></tr>${list.slice(0, 25).map(row).join('')}</table>` : '<p class="muted">No runs recorded yet. Finish a run — or reset one — and it lands here.</p>'}
      <p class="hint" style="margin-top:10px">Score = progress + achievements this run, plus a big bonus for finishing (faster is better). ${Game.S.ended ? 'This run is complete.' : `Current run so far: <b>${U.fmtInt(computeScore(false))}</b>.`}</p>`;
    Game.modal({ title: '🥇 High Scores', body, wide: true, buttons: [
      { label: '🧹 Wipe stats & scores', kind: 'ghost', keepOpen: true, onClick: () => confirmWipeRecords(openScores) },
      { label: 'Close' },
    ] });
  }

  function openSettings() {
    const s = Game.settings;
    const body = U.el('div', { class: 'col', style: { gap: '12px' } });
    const toggle = (label, key, after) => U.el('label', { class: 'row', style: { cursor: 'pointer', justifyContent: 'space-between' } }, U.el('span', { text: label }),
      U.el('input', { type: 'checkbox', checked: !!s[key], on: { change: (e) => { s[key] = e.target.checked; Game.saveMeta(); if (after) after(); syncTopButtons(); } } }));
    const slider = (label, key, after) => U.el('div', {}, U.el('div', { class: 'hint', text: label }),
      U.el('input', { type: 'range', min: 0, max: 100, value: Math.round(s[key] * 100), on: { input: (e) => { s[key] = +e.target.value / 100; Game.saveMeta(); if (after) after(); } } }));
    const audio = () => { Game.audioApply && Game.audioApply(); Game.music && Game.music.refresh(); };
    const notation = U.el('select', { on: { change: (e) => { s.notation = e.target.value; Game.saveMeta(); } } },
      ...[['short', '1.23M (short)'], ['long', '1.23 million (long)'], ['sci', '1.23e6 (scientific)']].map(([v, l]) => U.el('option', { value: v, text: l, selected: s.notation === v })));
    const card = (title, ...kids) => U.el('div', { class: 'card', style: { margin: 0 } }, U.el('div', { class: 'card-title', style: { marginBottom: '8px' }, text: title }), ...kids);
    const ta = U.el('textarea', { rows: 3, style: { width: '100%', fontFamily: 'var(--font-mono)', fontSize: '11px' }, placeholder: 'Paste a save code here to import, or press Export to get yours.' });
    body.append(
      U.el('div', { class: 'grid2' },
        card('🔊 Audio', toggle('Sound effects', 'sfx', audio), slider('Effects volume', 'volume', audio), toggle('Music', 'music', audio), slider('Music volume', 'musicVolume', audio)),
        card('🎨 Display', U.el('div', { class: 'row', style: { justifyContent: 'space-between' } }, U.el('span', { text: 'Numbers' }), notation),
          U.el('div', { class: 'row', style: { justifyContent: 'space-between' } }, U.el('span', { text: 'Graphics' }), U.el('select', { on: { change: (e) => { s.graphics = e.target.value; Game.saveMeta(); Game.applyGfx(); } } },
            ...[['high', 'High (all effects)'], ['balanced', 'Balanced (smooth)'], ['low', 'Low (fastest)']].map(([v, l]) => U.el('option', { value: v, text: l, selected: (s.graphics || 'balanced') === v })))),
          toggle('Particles & floating text', 'particles'), toggle('Reduce motion', 'reduceMotion', () => document.body.classList.toggle('reduce-motion', s.reduceMotion)))),
      card('💾 Save', U.el('div', { class: 'hint', style: { marginBottom: '6px' }, text: 'The game autosaves in this browser every 10 seconds. Export a save code to move your run to another browser or share it with a friend.' }),
        ta,
        U.el('div', { class: 'row', style: { marginTop: '8px' } },
          U.el('button', { class: 'btn', text: '💾 Save now', on: { click: () => { if (Game.save()) Game.toast('Game saved.', 'good', '💾'); } } }),
          U.el('button', { class: 'btn', text: '📤 Export', on: { click: () => { ta.value = Game.exportSave(); ta.select(); try { navigator.clipboard.writeText(ta.value); Game.toast('Save code copied to clipboard!', 'good', '📋'); } catch (e) { /* ignore */ } } } }),
          U.el('button', { class: 'btn', text: '📥 Import', on: { click: () => { if (ta.value.trim()) { Game.confirm('Import save?', 'This replaces your current run with the imported one. Your current run is not recorded.', 'Import', () => { Game.closeAllModals(); Game.importSave(ta.value); }, 'danger'); } } } }),
          U.el('button', { class: 'btn', text: '⬇️ Save file', on: { click: () => downloadSave() } }))),
      card('🌱 Reset', U.el('div', { class: 'hint', style: { marginBottom: '8px' }, text: 'Start over from a single hive. Your current run is recorded in the High Scores first. Achievements and personal bests are kept.' }),
        U.el('div', { class: 'row', style: { flexWrap: 'wrap' } },
          U.el('button', { class: 'btn danger', text: '🔄 Reset run', on: { click: confirmReset } }),
          U.el('button', { class: 'btn', text: '🧹 Wipe stats & scores…', title: 'Clear high scores, personal bests and all-time stats. Achievements are kept.', on: { click: () => confirmWipeRecords(openSettings) } }),
          U.el('button', { class: 'btn ghost sm', text: 'Delete ALL data…', on: { click: confirmWipe } }))),
      U.el('div', { class: 'hint', style: { textAlign: 'center' }, html: 'The Infinite Hive · an original incremental game · v1.0 · press <b>?</b> for keyboard shortcuts' }));
    Game.modal({ title: '⚙️ Settings', body, wide: true, buttons: [{ label: 'Done', kind: 'primary' }] });
  }
  function downloadSave() {
    const blob = new Blob([Game.exportSave()], { type: 'text/plain' });
    const a = U.el('a', { href: URL.createObjectURL(blob), download: `infinite-hive-save-${new Date().toISOString().slice(0, 10)}.txt` });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function confirmReset() {
    const S = Game.S;
    Game.modal({
      title: '🔄 Reset this run?',
      body: `<p>You are in <b>Phase ${S.phase}</b> at <b>${U.fmtTime(Game.runMs())}</b> (${(progress() * 100).toFixed(1)}% progress).</p><p>This run will be saved to the High Scores, then a brand-new hive begins. This can’t be undone.</p>`,
      buttons: [{ label: 'Keep playing' }, {
        label: 'Yes, reset', kind: 'danger', onClick: () => {
          const entry = S.ended ? null : recordRun('abandoned');
          Game.achieve('m_reset');
          Game.resetRun();
          Game.toast(entry ? `Run recorded with score ${U.fmtInt(entry.score)}. A new hive awakens…` : 'A new hive awakens…', 'info', '🌱');
        },
      }],
    });
  }
  /** Clears high scores, personal-best splits and all-time statistics.
      Achievements, settings and the run in progress are kept. */
  function wipeRecords() {
    const M = Game.meta;
    M.scores = [];
    M.bestSplits = { p2: null, p3: null, end: null };
    M.lifetime = { clicks: 0, honey: 0, playMs: 0 };
    M.runs = 1;                 // the run in progress
    M.firstPlayed = Date.now();
    Game.saveMeta();
  }
  function confirmWipeRecords(reopen) {
    const n = Game.meta.scores.length;
    const got = Game._achOrder.filter((id) => Game.hasAch(id)).length;
    Game.modal({
      title: '🧹 Wipe stats & high scores?',
      body: `<p>This permanently clears:</p>
        <ul style="margin:6px 0 10px 18px; line-height:1.6">
          <li>All <b>${n}</b> high-score ${n === 1 ? 'entry' : 'entries'}, including the fastest completions</li>
          <li>Personal-best splits (Phase I, Phase II and fastest win)</li>
          <li>All-time statistics: runs, total play time and total clicks</li>
        </ul>
        <p><b class="good">Kept:</b> your <b>${got}</b> achievement${got === 1 ? '' : 's'}, your settings and the run you are playing now.</p>`,
      buttons: [{ label: 'Cancel' }, {
        label: '🧹 Wipe stats & scores', kind: 'danger', onClick: () => {
          wipeRecords();
          Game.closeAllModals();
          Game.toast('Stats and high scores wiped. Achievements kept.', 'info', '🧹');
          if (reopen) reopen();
        },
      }],
    });
  }
  Game.wipeRecords = wipeRecords;

  function confirmWipe() {
    Game.modal({
      title: '⚠️ Delete all data?',
      body: '<p>This deletes your current run, <b>all high scores, personal bests and achievements</b>. Type <b>DELETE</b> to confirm.</p><input type="text" id="wipe-input" style="width:100%">',
      buttons: [{ label: 'Cancel' }, {
        label: 'Delete everything', kind: 'danger', keepOpen: true, onClick: (h) => {
          const v = U.$('#wipe-input').value.trim().toUpperCase();
          if (v !== 'DELETE') { Game.sfx('error'); return; }
          h.close();
          Game.wipeAll();
        },
      }],
    });
  }
  function openHelp() {
    Game.modal({
      title: '❔ How to play',
      body: `<p><b>Click the big comb</b> to gather honey. Sell honey for coins, then hire bees and buy buildings that produce honey for you.</p>
        <p>Spend 💫 <b>Waggle</b> (from Scout Bees) on <b>Research</b> to unlock new systems — the Exchange (stocks), the Lounge (casino), automation, and eventually… something bigger.</p>
        <p>Catch the glowing <b>👑 Royal Bee</b> when it flies by for powerful bonuses. Royal Jelly buys permanent <b>Royal Edicts</b>.</p>
        <p>The game has <b>three phases</b>. The run timer at the top tracks how long you take; splits compare you to your personal best.</p>
        <div class="sep"></div>
        <div class="kv"><span>Space / Enter (comb focused)</span><b>Click</b></div>
        <div class="kv"><span>1–7</span><b>Switch tabs</b></div>
        <div class="kv"><span>S</span><b>Sell all honey (Phase I)</b></div>
        <div class="kv"><span>M</span><b>Toggle music</b></div>
        <div class="kv"><span>Esc</span><b>Close dialogs</b></div>`,
      buttons: [{ label: 'Got it', kind: 'primary' }],
    });
  }

  function syncTopButtons() {
    const s = Game.settings;
    U.$('#btn-sfx').classList.toggle('off', !s.sfx);
    U.$('#btn-music').classList.toggle('off', !s.music);
    U.$('#btn-sfx').textContent = s.sfx ? '🔊' : '🔇';
  }

  /* =================== DEV PANEL (?dev) =================== */
  function buildDev() {
    const p = U.el('div', { id: 'dev-panel' });
    const btn = (label, fn) => p.appendChild(U.el('button', { class: 'btn sm', text: label, on: { click: () => { Game.S.flags.dev = true; fn(); } } }));
    btn('+1 min', () => Game.advance(60));
    btn('+10 min', () => Game.advance(600));
    btn('×1000 coins', () => Game.add('coins', Math.max(1000, Game.S.res.coins * 1000)));
    btn('+waggle', () => Game.add('waggle', Math.max(1000, Game.S.res.waggle * 10)));
    btn('+jelly', () => Game.add('jelly', 10));
    btn('+stardust', () => Game.add('stardust', Math.max(1e5, Game.S.res.stardust * 100)));
    btn('+drones', () => Game.add('drones', Math.max(100, Game.S.res.drones * 2)));
    btn('+honey/inf', () => { Game.add('honey', Math.max(1e6, Game.S.res.honey * 100)); Game.add('influence', 1000); Game.add('swarm', Game.S.res.swarm * 2); });
    btn('royal', () => { if (!royal.el) spawnRoyal(); });
    btn('event', () => runEvent());
    btn('tabs', () => ['research', 'exchange', 'lounge'].forEach((t) => Game.unlockTab(t)));
    btn('next phase', () => { if (Game.S.phase < 3) Game.setPhase(Game.S.phase + 1); });
    btn('buy research', () => { for (const p of Game.PROJECTS) Game.buyProject(p.id, true); });
    document.body.appendChild(p);
  }

  /* =================== module =================== */
  let msT = 0;
  Game.register({
    id: 'meta',
    defaults: () => ({ nextRoyal: 90, nextEvent: 150 }),
    mount() {
      tick.el = U.$('#tk-text'); tick.track = U.$('#ticker .tk-track');
      buildSplits();
      U.$('#btn-ach').addEventListener('click', () => { Game.sfx('click'); openAchievements(); });
      U.$('#btn-stats').addEventListener('click', () => { Game.sfx('click'); openStats(); });
      U.$('#btn-scores').addEventListener('click', () => { Game.sfx('click'); openScores(); });
      U.$('#run-timer').addEventListener('click', () => { Game.sfx('click'); openScores(); });
      U.$('#btn-settings').addEventListener('click', () => { Game.sfx('click'); openSettings(); });
      U.$('#btn-sfx').addEventListener('click', () => { Game.settings.sfx = !Game.settings.sfx; Game.saveMeta(); Game.audioApply && Game.audioApply(); syncTopButtons(); Game.sfx('click'); });
      U.$('#btn-music').addEventListener('click', () => { Game.settings.music = !Game.settings.music; Game.saveMeta(); Game.music && Game.music.refresh(); syncTopButtons(); });
      document.addEventListener('keydown', (e) => {
        if ((e.target.matches && e.target.matches('input, textarea, select')) || e.ctrlKey || e.metaKey || e.altKey) return;
        if (U.$('#modal-root').children.length) return;
        if (e.key === '?') openHelp();
        else if (e.key === 'm' || e.key === 'M') U.$('#btn-music').click();
        else if (/^[1-9]$/.test(e.key) && !(Game.activeTab === 'fleet' && Game.combat && Game.combat.busy && Game.combat.busy())) {
          const vis = Game.tabs.filter((t) => Game.S.tabs[t.id]);
          const t = vis[+e.key - 1]; if (t) Game.switchTab(t.id);
        }
      });
      if (Game.dev) buildDev();
    },
    onLoad(isNew) {
      syncTopButtons();
      removeRoyal();
      eventOpen = false;
      const S = Game.S;
      if (isNew) {
        Game.log('🐝 <b>THE INFINITE HIVE</b> — a new colony awakens.', 'story');
        if ((Game.meta.runs || 1) <= 1) setTimeout(openHelp, 600);
      }
      if (Game.music) Game.music.setPhase(S.phase);
      if (S.ended) setTimeout(() => { if (Game.S === S && S.ended) showSummary(Game.meta.scores.find((e) => e.id === S.runId), false); }, 500);
      const h = new Date().getHours();
      if (h >= 0 && h < 4) Game.achieve('m_night');
    },
    tick(dt) {
      const S = Game.S, M = S.meta;
      if (Game.offline || S.ended) return;
      msT += dt;
      if (msT >= 1) {
        msT = 0;
        if (Object.values(S.tabs).filter(Boolean).length >= 5) Game.achieve('m_tabs');
      }
    },
    render() { renderSplits(); },
    frame(dt) {
      const S = Game.S;
      tickerFrame(dt);
      royalFrame(dt);
      if (S.ended || document.hidden) return;
      const M = S.meta;
      // royal scheduling (in real time while visible)
      if (!royal.el && S.time > 60) {
        M.nextRoyal -= dt;
        if (M.nextRoyal <= 0) { M.nextRoyal = royalInterval(); spawnRoyal(); }
      }
      // events
      M.nextEvent -= dt;
      if (M.nextEvent <= 0) {
        if (canInterrupt() && S.time > 120) { if (runEvent()) M.nextEvent = U.rand(150, 300); else M.nextEvent = 60; }
        else M.nextEvent = 15;
      }
    },
  });

  Game.defineAchievements([
    { id: 'm_royal1', name: 'Royal Audience', desc: 'Catch a Royal Bee.', icon: '👑' },
    { id: 'm_royal10', name: 'Queen’s Favorite', desc: 'Catch 10 Royal Bees in one run.', icon: '💎' },
    { id: 'm_events10', name: 'Decisive', desc: 'Answer 10 random events in one run.', icon: '❗' },
    { id: 'm_tabs', name: 'Diversified Portfolio', desc: 'Have 5 tabs unlocked at once.', icon: '🗂️' },
    { id: 'm_p2', name: 'Beyond the Fence', desc: 'Reach Phase II.', icon: '🌍' },
    { id: 'm_p3', name: 'Ad Astra', desc: 'Reach Phase III.', icon: '🚀' },
    { id: 'm_win', name: 'The End?', desc: 'Complete a run.', icon: '🏁' },
    { id: 'm_end_hive', name: 'Infinite', desc: 'Choose to pollinate the last flower.', icon: '♾️' },
    { id: 'm_end_bloom', name: 'The Gardener', desc: 'Choose to let the last flower bloom.', icon: '🌸' },
    { id: 'm_speed90', name: 'Swift Swarm', desc: 'Complete a run in under 90 minutes of game time.', icon: '⚡' },
    { id: 'm_speed60', name: 'Speedrunner', desc: 'Complete a run in under 60 minutes of game time.', icon: '🏎️' },
    { id: 'm_reset', name: 'Fresh Start', desc: 'Reset a run.', icon: '🌱' },
    { id: 'm_night', name: 'Night Shift', desc: 'Play between midnight and 4 AM.', icon: '🦉', hidden: true },
  ]);
})();

;
/* ---- 99-main.js ---- */
/* ============================================================
   99-main.js — boot
   ============================================================ */
(() => {
  'use strict';
  const start = () => {
    try { Game.boot(); } catch (err) {
      console.error(err);
      document.body.insertAdjacentHTML('beforeend', `<div style="position:fixed;inset:auto 10px 50px 10px;z-index:999;background:#400;color:#fff;padding:12px;border-radius:8px;font:12px monospace">The hive hit a snag while starting: ${String(err && err.message || err)}</div>`);
    }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
</body>
</html>
